<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation site header</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/rlc/E1.css">
</head>
<body>
  <div data-rl-root data-rl="group">
    <header data-rlp="header" data-rl="container" data-rl-flow="wrap" data-rl-bond="related">
      <a href="#" data-rlp="brand" data-rl-size="content">Northwind Docs</a>
      <nav aria-label="Primary" data-rlp="nav" data-rl="group" data-rl-flow="wrap" data-rl-bond="related" data-rl-fill>
        <a href="#" data-rlp="link-guides">Guides</a>
        <a href="#" data-rlp="link-api" aria-current="page" style="font-weight:700;text-decoration:underline">API reference</a>
        <a href="#" data-rlp="link-sdks">SDKs</a>
        <a href="#" data-rlp="link-integrations">Integrations and partner ecosystem</a>
        <a href="#" data-rlp="link-changelog">Changelog</a>
      </nav>
      <div data-rl="group" data-rl-bond="tight" data-rl-min="14rem" style="--rl-min: 14rem">
        <label for="search-input" data-rlp="search-label">Search documentation</label>
        <input id="search-input" type="search" data-rlp="search-input" data-rl-align-edge="ctl">
      </div>
      <button type="button" data-rlp="signin" data-rl-size="content" data-rl-align-edge="ctl">Sign in</button>
    </header>
  </div>
</body>
</html>
