<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Row switch on content widths</title>
  <link rel="stylesheet" href="assets/base.css">
  <script type="module" src="assets/rlp/rlp.mjs"></script>
</head>
<body>
<main data-rl-root data-rl="group">
  <!-- Reduced from RLP-001 attempt fu3c051d74 (T04). Nested flow=row without
       data-rl-min on every child: Arm C keeps each row on one line while the
       comfortable widths fit and stacks every child otherwise. Static CSS
       cannot know content widths, so rlc wraps per item. Growing the role text
       (the T04 dynamic step) re-wraps the inner row and the name moves. -->
  <article data-rl="container" data-rl-bond="loose">
    <div data-rl="group" data-rl-flow="row">
      <div data-rl="group" data-rl-flow="row" data-rl-bond="related" data-rl-fill>
        <img src="assets/placeholder.svg" alt="" width="64" height="64" data-rl-size="content">
        <div data-rl="group" data-rl-bond="tight" data-rl-fill>
          <h2 id="name">Dana Okafor</h2>
          <p id="role">Principal engineer, Platform reliability</p>
        </div>
      </div>
      <button type="button" data-rl-anchor="end" data-rl-size="content">Follow</button>
    </div>
  </article>
</main>
</body>
</html>
