<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deeply nested settings in a narrow column</title>
  <link rel="stylesheet" href="assets/base.css">
  <script type="module" src="assets/rlp/rlp.mjs"></script>
</head>
<body>
  <main data-rl-root data-rl="group" data-rlp="page">
    <h1 data-rlp="page-title">Device settings</h1>
    <div data-rl="group" data-rl-flow="row" data-rl-align="start" data-rlp="layout">
      <nav data-rl="container" data-rl-flow="wrap" data-rl-min="20rem" data-rl-max="20rem" aria-label="Settings sections" data-rlp="sidebar">
        <a href="#" data-rlp="side-1">General</a>
        <a href="#" aria-current="page" data-rlp="side-2">Sync</a>
        <a href="#" data-rlp="side-3">Security</a>
      </nav>
      <section data-rl="container" data-rl-fill data-rl-min="16rem" data-rlp="content">
        <h2 data-rlp="sync-title">Sync</h2>
        <fieldset data-rl="container" data-rlp="group">
          <legend data-rlp="group-legend">Synchronization</legend>
          <div data-rl="container" data-rlp="row">
            <div data-rl="group" data-rl-flow="row" data-rl-align="start">
              <input type="checkbox" id="auto" data-rl-size="content" aria-describedby="auto-hint" data-rlp="auto-input">
              <label for="auto" data-rl-fill data-rlp="auto-label" style="overflow-wrap:anywhere">AutomaticallySynchronizeAcrossAllRegisteredDevicesAndWorkspaces</label>
            </div>
            <p id="auto-hint" data-rlp="auto-hint">Changes appear on every signed-in device within a minute.</p>
          </div>
          <div data-rl="group">
            <label for="endpoint" data-rlp="endpoint-label">Sync endpoint URL (prefers at least 30rem of width)</label>
            <input type="url" id="endpoint" data-rl-min="30rem" data-rlp="endpoint-input" style="max-width:100%;min-width:0">
          </div>
          <div data-rl="group">
            <label for="interval" data-rlp="interval-label">Interval in minutes</label>
            <input type="number" id="interval" min="1" data-rlp="interval-input">
          </div>
        </fieldset>
        <button type="button" data-rlp="save">Save settings</button>
      </section>
    </div>
  </main>
</body>
</html>
