<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment thread with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <script type="module" src="assets/rlp/rlp.mjs"></script>
</head>
<body>
  <main data-rl-root data-rl="group">
    <section data-rl="container" data-rlp="thread">
      <h2 data-rlp="title">Discussion</h2>
      <ol data-rl="group" data-rlp="comments">
        <li data-rl="group" data-rlp="comment-1" data-rl-flow="row" data-rl-align="start">
          <img data-rlp="comment-1-avatar" src="assets/placeholder.svg" alt="" width="40" height="40" data-rl-size="content">
          <div data-rl="group" data-rl-fill data-rl-min="12rem">
            <div data-rl="group" data-rl-flow="wrap" data-rl-align="start">
              <span data-rlp="comment-1-author" data-rl-size="content">Priya</span>
              <span data-rlp="comment-1-time" data-rl-size="content">3 hours ago</span>
            </div>
            <p data-rlp="comment-1-body">Can we ship the migration behind a flag first?</p>
            <button type="button" class="secondary" data-rlp="comment-1-reply" aria-label="Reply to Priya" data-rl-size="content">Reply</button>
          </div>
        </li>
        <li data-rl="group" data-rlp="comment-2" data-rl-flow="row" data-rl-align="start">
          <img data-rlp="comment-2-avatar" src="assets/placeholder.svg" alt="" width="40" height="40" data-rl-size="content">
          <div data-rl="group" data-rl-fill data-rl-min="12rem">
            <div data-rl="group" data-rl-flow="wrap" data-rl-align="start">
              <span data-rlp="comment-2-author" data-rl-size="content">Marcus</span>
              <span data-rlp="comment-2-time" data-rl-size="content">2 hours ago</span>
            </div>
            <p data-rlp="comment-2-body">Agreed. I added a flag to the rollout plan.</p>
            <button type="button" class="secondary" data-rlp="comment-2-reply" aria-label="Reply to Marcus" data-rl-size="content">Reply</button>
          </div>
        </li>
        <li data-rl="group" data-rlp="comment-3" data-rl-flow="row" data-rl-align="start">
          <img data-rlp="comment-3-avatar" src="assets/placeholder.svg" alt="" width="40" height="40" data-rl-size="content">
          <div data-rl="group" data-rl-fill data-rl-min="12rem">
            <div data-rl="group" data-rl-flow="wrap" data-rl-align="start">
              <span data-rlp="comment-3-author" data-rl-size="content">Lena</span>
              <span data-rlp="comment-3-time" data-rl-size="content">1 hour ago</span>
            </div>
            <p data-rlp="comment-3-body">Looks good to me.</p>
            <button type="button" class="secondary" data-rlp="comment-3-reply" aria-label="Reply to Lena" data-rl-size="content">Reply</button>
          </div>
        </li>
      </ol>
      <p role="status" data-rlp="more-status">Loading earlier comments…</p>
      <div data-rl="group">
        <label for="composer-input" data-rlp="composer-label">Add a comment</label>
        <textarea id="composer-input" rows="3" data-rlp="composer-input" aria-describedby="composer-error"></textarea>
        <p id="composer-error" class="error" data-rlp="composer-error" hidden>Write a comment before posting.</p>
        <button type="button" data-rlp="post" data-rl-size="content">Post comment</button>
      </div>
    </section>
  </main>
</body>
</html>
