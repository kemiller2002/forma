<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create-account form</title>
  <link rel="stylesheet" href="assets/forma.css">
  <link rel="stylesheet" href="assets/base.css">
  <style>
  main { padding: var(--ef-primitive-spacing-4); }
  [hidden] { display: none !important; }
  .pref { --ef-cluster-gap: var(--ef-primitive-spacing-3); flex-wrap: nowrap; justify-content: flex-start; }
  .pref label { min-inline-size: 0; }
  fieldset.ef-stack { --ef-stack-gap: var(--ef-primitive-spacing-3); }
  legend { font-weight: 650; padding-block-end: var(--ef-primitive-spacing-3); }
  .ef-field > input { inline-size: 100%; }
</style>
</head>
<body>
  <main>
    <form class="ef-form ef-surface surface" data-rlp="form" action="#" method="get">
      <h1 data-rlp="title">Create your account</h1>
      <p data-rlp="intro">All fields marked with an asterisk are required.</p>

      <div class="ef-form-row">
        <div class="ef-field">
          <label class="ef-field__label" for="name-input" data-rlp="name-label">Full name *</label>
          <input type="text" id="name-input" name="name" autocomplete="name" required data-rlp="name-input">
        </div>
        <div class="ef-field">
          <label class="ef-field__label" for="email-input" data-rlp="email-label">Email address *</label>
          <input type="email" id="email-input" name="email" autocomplete="email" required aria-describedby="email-error" data-rlp="email-input">
          <p class="ef-validation-message error" id="email-error" hidden data-rlp="email-error">Enter an email address in the format name@example.com.</p>
        </div>
      </div>

      <div class="ef-form-row">
        <div class="ef-field">
          <label class="ef-field__label" for="password-input" data-rlp="password-label">Password *</label>
          <p class="ef-field__description" id="password-hint" data-rlp="password-hint">Use at least 12 characters.</p>
          <input type="password" id="password-input" name="password" autocomplete="new-password" required aria-describedby="password-hint password-error" data-rlp="password-input">
          <p class="ef-validation-message error" id="password-error" hidden data-rlp="password-error">Your password is too short.</p>
        </div>
        <div class="ef-field">
          <label class="ef-field__label" for="confirm-input" data-rlp="confirm-label">Confirm password *</label>
          <input type="password" id="confirm-input" name="confirm" autocomplete="new-password" required data-rlp="confirm-input">
        </div>
      </div>

      <fieldset class="ef-stack" data-rlp="prefs">
        <legend data-rlp="prefs-legend">Email preferences</legend>
        <div class="ef-cluster pref">
          <input type="checkbox" id="pref-news-input" name="news" data-rlp="pref-news-input">
          <label for="pref-news-input" data-rlp="pref-news-label">Product news</label>
        </div>
        <div class="ef-cluster pref">
          <input type="checkbox" id="pref-tips-input" name="tips" data-rlp="pref-tips-input">
          <label for="pref-tips-input" data-rlp="pref-tips-label">Tips and tutorials</label>
        </div>
      </fieldset>

      <div class="ef-actions" data-rlp="actions">
        <button type="button" class="secondary" data-rlp="cancel">Cancel</button>
        <button type="submit" data-rlp="submit">Create account</button>
      </div>
    </form>
  </main>
</body>
</html>
