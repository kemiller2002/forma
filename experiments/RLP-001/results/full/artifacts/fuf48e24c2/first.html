<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deeply nested settings in a narrow column</title>
  <link rel="stylesheet" href="assets/base.css">
  <script type="module" src="assets/rlp/rlp.mjs"></script>
</head>
<body>
  <main data-rlp="page" data-rl-root data-rl="group" data-rl-bond="section">
    <h1 data-rlp="page-title">Device settings</h1>
    <div data-rlp="layout" data-rl="group" data-rl-flow="row" data-rl-bond="section">
      <nav data-rlp="sidebar" data-rl="container" data-rl-min="12rem" data-rl-max="20rem" aria-label="Settings sections">
        <a data-rlp="side-1" href="#">General</a>
        <a data-rlp="side-2" href="#" aria-current="page">Sync</a>
        <a data-rlp="side-3" href="#">Security</a>
      </nav>
      <section data-rlp="content" data-rl="container" data-rl-fill data-rl-min="16rem" data-rl-bond="loose">
        <h2 data-rlp="sync-title">Sync</h2>
        <fieldset data-rlp="group" data-rl="container" data-rl-bond="loose">
          <legend data-rlp="group-legend">Synchronization</legend>
          <div data-rlp="row" data-rl="container" data-rl-bond="related">
            <input data-rlp="auto-input" id="auto-input" type="checkbox" aria-describedby="auto-hint">
            <label data-rlp="auto-label" for="auto-input" style="overflow-wrap:anywhere">AutomaticallySynchronizeAcrossAllRegisteredDevicesAndWorkspaces</label>
            <p data-rlp="auto-hint" id="auto-hint">Changes appear on every signed-in device within a minute.</p>
          </div>
          <div data-rl="group" data-rl-bond="tight">
            <label data-rlp="endpoint-label" for="endpoint-input">Sync endpoint URL (prefers at least 30rem of width)</label>
            <input data-rlp="endpoint-input" id="endpoint-input" type="url" data-rl-min="30rem">
          </div>
          <div data-rl="group" data-rl-bond="tight">
            <label data-rlp="interval-label" for="interval-input">Interval in minutes</label>
            <input data-rlp="interval-input" id="interval-input" type="number" min="1">
          </div>
        </fieldset>
        <button data-rlp="save" type="button" data-rl-size="content">Save settings</button>
      </section>
    </div>
  </main>
</body>
</html>
