<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deeply nested settings in a narrow column</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  main { padding: var(--ef-primitive-spacing-4); min-inline-size: 0; }
  fieldset.ef-stack { min-inline-size: 0; margin: 0; }
  .check-row { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ef-primitive-spacing-3); row-gap: var(--ef-primitive-spacing-2); align-items: start; }
  .check-row [data-rlp="auto-hint"] { grid-column: 2; margin: 0; }
  .check-row label { min-inline-size: 0; overflow-wrap: anywhere; }
  .endpoint { inline-size: min(100%, 30rem); max-inline-size: 100%; box-sizing: border-box; }
  .interval { max-inline-size: 100%; box-sizing: border-box; }
  nav a { display: inline-block; min-block-size: 1.75rem; line-height: 1.75rem; }
  legend { float: left; inline-size: 100%; box-sizing: border-box; padding: 0; margin: 0 0 var(--ef-primitive-spacing-3); }
  legend + * { clear: both; margin-block-start: 0 !important; }
  .field { display: flex; flex-direction: column; gap: var(--ef-primitive-spacing-2); min-inline-size: 0; }
  </style>
</head>
<body>
  <main data-rlp="page" class="ef-stack">
    <h1 data-rlp="page-title">Device settings</h1>
    <div data-rlp="layout" class="ef-sidebar" style="--ef-sidebar-width: 18rem">
      <nav data-rlp="sidebar" class="ef-surface ef-sidebar__side" aria-label="Settings sections">
        <ul class="ef-cluster" style="list-style:none;margin:0;padding:0;--ef-cluster-gap:var(--ef-primitive-spacing-3)">
          <li><a data-rlp="side-1" href="#">General</a></li>
          <li><a data-rlp="side-2" href="#" aria-current="page">Sync</a></li>
          <li><a data-rlp="side-3" href="#">Security</a></li>
        </ul>
      </nav>
      <section data-rlp="content" class="ef-surface ef-stack ef-sidebar__content">
        <h2 data-rlp="sync-title">Sync</h2>
        <fieldset data-rlp="group" class="ef-surface ef-stack">
          <legend data-rlp="group-legend">Synchronization</legend>
          <div data-rlp="row" class="ef-surface check-row">
            <input type="checkbox" id="auto-input" data-rlp="auto-input" aria-describedby="auto-hint">
            <label for="auto-input" data-rlp="auto-label">AutomaticallySynchronizeAcrossAllRegisteredDevicesAndWorkspaces</label>
            <p id="auto-hint" data-rlp="auto-hint">Changes appear on every signed-in device within a minute.</p>
          </div>
          <div class="field">
            <label for="endpoint-input" data-rlp="endpoint-label">Sync endpoint URL (prefers at least 30rem of width)</label>
            <input type="url" id="endpoint-input" data-rlp="endpoint-input" class="endpoint">
          </div>
          <div class="field">
            <label for="interval-input" data-rlp="interval-label">Interval in minutes</label>
            <input type="number" min="1" id="interval-input" data-rlp="interval-input" class="interval">
          </div>
        </fieldset>
        <div class="ef-actions">
          <button type="button" data-rlp="save">Save settings</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
