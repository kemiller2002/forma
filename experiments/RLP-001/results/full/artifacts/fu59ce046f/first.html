<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deeply nested settings in a narrow column</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  main { max-inline-size: 90rem; margin-inline: auto; padding: 1.5rem 1rem 2rem; display: grid; gap: 1.5rem; min-inline-size: 0; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; align-items: start; min-inline-size: 0; }
  @media (min-width: 48rem) {
    .layout { grid-template-columns: minmax(10rem, 16rem) minmax(0, 1fr); }
  }
  nav.sidebar { padding: 0.75rem; min-inline-size: 0; }
  nav.sidebar ul { display: grid; gap: 0.5rem; }
  nav.sidebar a { display: block; padding: 0.5rem 0.75rem; min-block-size: 2.75rem; border-radius: 0.375rem; }
  nav.sidebar a[aria-current=page] { background: #eef3f0; }
  section.content { padding: 1.25rem; display: grid; gap: 1.25rem; min-inline-size: 0; }
  fieldset.group { padding: 1rem; display: grid; gap: 1rem; min-inline-size: 0; }
  fieldset.group legend { font-weight: 700; padding: 0; margin-block-end: 0.25rem; }
  .row { padding: 1rem; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 0.75rem; row-gap: 0.25rem; align-items: start; min-inline-size: 0; }
  .row input[type=checkbox] { grid-column: 1; grid-row: 1; margin-block-start: 0.125rem; }
  .row label { grid-column: 2; grid-row: 1; min-inline-size: 0; }
  .row .hint { grid-column: 2; grid-row: 2; min-inline-size: 0; }
  .field { display: grid; gap: 0.25rem; min-inline-size: 0; }
  .field input { inline-size: min(100%, 30rem); max-inline-size: 100%; }
  .actions { display: flex; }
  </style>
</head>
<body>
  <main data-rlp="page">
    <h1 data-rlp="page-title">Device settings</h1>
    <div class="layout" data-rlp="layout">
      <nav class="surface sidebar" data-rlp="sidebar" aria-label="Settings sections">
        <ul>
          <li><a href="#" data-rlp="side-1">General</a></li>
          <li><a href="#" data-rlp="side-2" aria-current="page">Sync</a></li>
          <li><a href="#" data-rlp="side-3">Security</a></li>
        </ul>
      </nav>
      <section class="surface content" data-rlp="content">
        <h2 data-rlp="sync-title">Sync</h2>
        <fieldset class="surface group" data-rlp="group">
          <legend data-rlp="group-legend">Synchronization</legend>
          <div class="surface row" data-rlp="row">
            <input type="checkbox" id="auto" data-rlp="auto-input" aria-describedby="auto-hint">
            <label for="auto" data-rlp="auto-label">AutomaticallySynchronizeAcrossAllRegisteredDevicesAndWorkspaces</label>
            <p class="muted hint" id="auto-hint" data-rlp="auto-hint">Changes appear on every signed-in device within a minute.</p>
          </div>
          <div class="field">
            <label for="endpoint" data-rlp="endpoint-label">Sync endpoint URL (prefers at least 30rem of width)</label>
            <input type="url" id="endpoint" data-rlp="endpoint-input">
          </div>
          <div class="field">
            <label for="interval" data-rlp="interval-label">Interval in minutes</label>
            <input type="number" min="1" id="interval" data-rlp="interval-input">
          </div>
        </fieldset>
        <div class="actions"><button type="button" data-rlp="save">Save settings</button></div>
      </section>
    </div>
  </main>
</body>
</html>
