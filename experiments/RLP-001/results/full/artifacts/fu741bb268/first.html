<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping address form</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  body { padding: var(--ef-primitive-spacing-4); }
  [hidden] { display: none !important; }
  .option { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ef-primitive-spacing-3); row-gap: var(--ef-primitive-spacing-1); align-items: center; }
  .option input { margin: 0; }
  .option .note { grid-column: 2; margin: 0; }
  .option input[type="radio"], #save-input { inline-size: 1.5rem; block-size: 1.5rem; }
  .save { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ef-primitive-spacing-3); align-items: center; }
  .save input { margin: 0; }
  fieldset.delivery { min-inline-size: 0; }
  fieldset.delivery legend { margin-block-end: var(--ef-primitive-spacing-3); font-weight: 650; }
  </style>
</head>
<body>
  <form class="ef-form ef-surface" data-rlp="form" action="#" novalidate>
    <h2 data-rlp="title">Shipping address</h2>

    <div class="ef-field">
      <label class="ef-field__label" for="street" data-rlp="street-label">Street address *</label>
      <input type="text" id="street" name="street" autocomplete="address-line1" required data-rlp="street-input">
    </div>

    <div class="ef-field">
      <label class="ef-field__label" for="unit" data-rlp="unit-label">Apartment, suite, or unit</label>
      <input type="text" id="unit" name="unit" autocomplete="address-line2" data-rlp="unit-input">
    </div>

    <div class="ef-form-row" style="--ef-form-row-min: 10rem">
      <div class="ef-field">
        <label class="ef-field__label" for="city" data-rlp="city-label">City *</label>
        <input type="text" id="city" name="city" autocomplete="address-level2" required data-rlp="city-input">
      </div>
      <div class="ef-field">
        <label class="ef-field__label" for="state" data-rlp="state-label">State *</label>
        <select id="state" name="state" data-rlp="state-input">
          <option value="">Choose a state</option>
          <option>Ohio</option>
          <option>Oregon</option>
          <option>Texas</option>
        </select>
      </div>
      <div class="ef-field">
        <label class="ef-field__label" for="zip" data-rlp="zip-label">ZIP code *</label>
        <input type="text" id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" required aria-describedby="zip-error" data-rlp="zip-input">
        <p class="ef-validation-message error" id="zip-error" hidden data-rlp="zip-error">Enter a five-digit ZIP code.</p>
      </div>
    </div>

    <fieldset class="delivery ef-stack" data-rlp="delivery">
      <legend data-rlp="delivery-legend">Delivery speed</legend>
      <div class="option">
        <input type="radio" id="standard" name="speed" value="standard" checked aria-describedby="standard-note" data-rlp="standard-input">
        <label for="standard" data-rlp="standard-label">Standard — free</label>
        <p class="note" id="standard-note" data-rlp="standard-note">Arrives in 5 to 7 business days.</p>
      </div>
      <div class="option">
        <input type="radio" id="express" name="speed" value="express" aria-describedby="express-note" data-rlp="express-input">
        <label for="express" data-rlp="express-label">Express — $12.00</label>
        <p class="note" id="express-note" data-rlp="express-note">Arrives in 2 business days.</p>
      </div>
    </fieldset>

    <div class="save">
      <input type="checkbox" id="save" name="save" data-rlp="save-input">
      <label for="save" data-rlp="save-label">Save this address for next time</label>
    </div>

    <div class="ef-actions" data-rlp="actions">
      <button type="button" class="secondary" data-rlp="back">Back to cart</button>
      <button type="submit" data-rlp="continue">Continue to payment</button>
    </div>
  </form>
</body>
</html>
