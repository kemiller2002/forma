<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deeply nested settings in a narrow column</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  main { padding: var(--ef-primitive-spacing-4); }
  .ef-sidebar__side nav { min-inline-size: 0; }
  nav ul { display: flex; flex-direction: column; gap: var(--ef-primitive-spacing-2); }
  nav a { display: inline-block; min-block-size: 1.5rem; padding-block: var(--ef-primitive-spacing-1); }
  .toggle-row { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--ef-primitive-spacing-3); row-gap: var(--ef-primitive-spacing-1); align-items: start; background: #fff; border: 1px solid #c9c5bb; border-radius: 0.5rem; padding: var(--ef-primitive-spacing-4); min-inline-size: 0; }
  .toggle-row input { grid-column: 1; grid-row: 1; margin-block-start: var(--ef-primitive-spacing-1); }
  .toggle-row label { grid-column: 2; grid-row: 1; font-weight: 600; min-inline-size: 0; }
  .toggle-row .hint { grid-column: 2; grid-row: 2; min-inline-size: 0; }
  fieldset.group { min-inline-size: 0; border: 1px solid #c9c5bb; border-radius: 0.5rem; padding: var(--ef-primitive-spacing-4); }
  fieldset.group legend { padding-inline: var(--ef-primitive-spacing-2); font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: var(--ef-primitive-spacing-2); min-inline-size: 0; }
  .field input { inline-size: min(100%, 30rem); max-inline-size: 100%; }
  .field input[type=number] { inline-size: min(100%, 10rem); }
</style>
</head>
<body>
  <main data-rlp="page" class="ef-stack">
    <h1 data-rlp="page-title">Device settings</h1>
    <div data-rlp="layout" class="ef-sidebar" style="--ef-sidebar-width: 14rem">
      <div class="ef-sidebar__side">
        <nav data-rlp="sidebar" class="ef-surface" aria-label="Settings sections">
          <ul>
            <li><a data-rlp="side-1" href="#">General</a></li>
            <li><a data-rlp="side-2" href="#" aria-current="page">Sync</a></li>
            <li><a data-rlp="side-3" href="#">Security</a></li>
          </ul>
        </nav>
      </div>
      <div class="ef-sidebar__content">
        <section data-rlp="content" class="ef-surface ef-stack">
          <h2 data-rlp="sync-title">Sync</h2>
          <fieldset data-rlp="group" class="group ef-stack">
            <legend data-rlp="group-legend">Synchronization</legend>
            <div data-rlp="row" class="toggle-row">
              <input data-rlp="auto-input" type="checkbox" id="auto" aria-describedby="auto-hint">
              <label data-rlp="auto-label" for="auto">AutomaticallySynchronizeAcrossAllRegisteredDevicesAndWorkspaces</label>
              <p data-rlp="auto-hint" class="hint muted" id="auto-hint">Changes appear on every signed-in device within a minute.</p>
            </div>
            <div class="field">
              <label data-rlp="endpoint-label" for="endpoint">Sync endpoint URL (prefers at least 30rem of width)</label>
              <input data-rlp="endpoint-input" type="url" id="endpoint">
            </div>
            <div class="field">
              <label data-rlp="interval-label" for="interval">Interval in minutes</label>
              <input data-rlp="interval-input" type="number" min="1" id="interval">
            </div>
          </fieldset>
          <div class="ef-actions">
            <button data-rlp="save" type="button">Save settings</button>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
