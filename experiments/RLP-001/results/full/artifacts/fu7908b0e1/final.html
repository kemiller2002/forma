<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <script type="module" src="assets/rlp/rlp.mjs"></script>
</head>
<body>
<main data-rl-root data-rl="group">
  <section data-rlp="summary" data-rl="container" data-rl-bond="loose" aria-labelledby="t">
    <h2 id="t" data-rlp="title">Order summary</h2>
    <ul data-rlp="items" data-rl="group" data-rl-bond="related" style="list-style:none;margin:0;padding:0">
        <li data-rlp="item-1" data-rl="group" data-rl-flow="row" data-rl-bond="related">
          <span data-rlp="item-1-name" data-rl-fill data-rl-min="8rem">Linen notebook</span>
          <span data-rlp="item-1-qty" data-rl-size="content">Qty 2</span>
          <span data-rlp="item-1-price" data-rl-size="content">$24.00</span>
          <button type="button" class="secondary" data-rlp="item-1-remove" data-rl-size="content" aria-label="Remove Linen notebook">Remove</button>
        </li>
        <li data-rlp="item-2" data-rl="group" data-rl-flow="row" data-rl-bond="related">
          <span data-rlp="item-2-name" data-rl-fill data-rl-min="8rem">Fountain pen</span>
          <span data-rlp="item-2-qty" data-rl-size="content">Qty 1</span>
          <span data-rlp="item-2-price" data-rl-size="content">$58.00</span>
          <button type="button" class="secondary" data-rlp="item-2-remove" data-rl-size="content" aria-label="Remove Fountain pen">Remove</button>
        </li>
        <li data-rlp="item-3" data-rl="group" data-rl-flow="row" data-rl-bond="related">
          <span data-rlp="item-3-name" data-rl-fill data-rl-min="8rem">Ink refills, pack of 12</span>
          <span data-rlp="item-3-qty" data-rl-size="content">Qty 3</span>
          <span data-rlp="item-3-price" data-rl-size="content">$18.00</span>
          <button type="button" class="secondary" data-rlp="item-3-remove" data-rl-size="content" aria-label="Remove Ink refills">Remove</button>
        </li>
    </ul>
    <div data-rl="group" data-rl-bond="tight">
      <label for="promo" data-rlp="promo-label">Promo code</label>
      <div data-rl="group" data-rl-flow="row" data-rl-bond="tight">
        <input type="text" id="promo" data-rlp="promo-input" data-rl-fill data-rl-min="8rem" data-rl-align-edge="promo" aria-describedby="promo-err">
        <button type="button" class="secondary" data-rlp="promo-apply" data-rl-size="content" data-rl-align-edge="promo">Apply</button>
      </div>
      <p id="promo-err" class="error" data-rlp="promo-error" hidden>That code has expired.</p>
    </div>
    <section data-rlp="shipping" data-rl="group" data-rl-bond="tight">
      <h3 data-rlp="shipping-title">Shipping</h3>
      <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
      <div data-rlp="shipping-options" data-rl="group" data-rl-bond="related" hidden>
        <div data-rl="group" data-rl-flow="row" data-rl-bond="tight">
          <input type="radio" id="sg" name="ship" checked data-rlp="ship-ground-input" data-rl-size="content">
          <label for="sg" data-rlp="ship-ground-label" data-rl-fill>Ground — $6.00</label>
        </div>
        <div data-rl="group" data-rl-flow="row" data-rl-bond="tight">
          <input type="radio" id="sa" name="ship" data-rlp="ship-air-input" data-rl-size="content">
          <label for="sa" data-rlp="ship-air-label" data-rl-fill>Air — $19.00</label>
        </div>
      </div>
    </section>
    <div data-rl="group" data-rl-flow="row" data-rl-bond="tight">
      <span data-rlp="total-label" data-rl-fill>Total</span>
      <span data-rlp="total-value" data-rl-size="content">$160.00</span>
    </div>
    <button type="submit" data-rlp="place">Place order</button>
  </section>
</main>
</body>
</html>
