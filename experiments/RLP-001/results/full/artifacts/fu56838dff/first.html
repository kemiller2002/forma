<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  
  body{margin:0;padding:1rem}
  .summary{max-width:40rem;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
  .items{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
  .items li{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name price" "qty remove";gap:.5rem 1rem;align-items:center;padding-bottom:.75rem;border-bottom:1px solid #ddd}
  .items li>[data-rlp$="-name"]{grid-area:name;overflow-wrap:anywhere}
  .items li>[data-rlp$="-qty"]{grid-area:qty}
  .items li>[data-rlp$="-price"]{grid-area:price;text-align:end}
  .items li>button{grid-area:remove;justify-self:end;min-height:1.75rem}
  @media(min-width:36rem){.items li{grid-template-columns:minmax(0,1fr) auto auto auto;grid-template-areas:"name qty price remove"}}
  .promo{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:flex-start}
  .promo label{flex:0 0 100%}
  .promo input{flex:1 1 10rem;min-width:0;box-sizing:border-box;height:2.5rem}
  .promo button{height:2.5rem;box-sizing:border-box}
  .promo .error{flex:0 0 100%;margin:0}
  .shipping{display:grid;gap:.5rem}
  .shipping h3,.shipping p{margin:0}
  .shipping-options{display:grid;gap:.25rem}
  .shipping-options div{display:flex;align-items:center;gap:.5rem;min-height:1.75rem}
  .total{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;font-weight:600;padding-top:.75rem;border-top:1px solid #ddd}
  .total p{margin:0}
  .place{min-height:2.75rem;width:100%}

</style>
</head>
<body>
  <section class="surface summary" data-rlp="summary">
  <h2 data-rlp="title" style="margin:0">Order summary</h2>
  <ul class="items" data-rlp="items">
    <li data-rlp="item-1"><span data-rlp="item-1-name">Linen notebook</span><span data-rlp="item-1-qty">Qty 2</span><span data-rlp="item-1-price">$24.00</span><button type="button" class="secondary" data-rlp="item-1-remove" aria-label="Remove Linen notebook">Remove</button></li>
    <li data-rlp="item-2"><span data-rlp="item-2-name">Fountain pen</span><span data-rlp="item-2-qty">Qty 1</span><span data-rlp="item-2-price">$58.00</span><button type="button" class="secondary" data-rlp="item-2-remove" aria-label="Remove Fountain pen">Remove</button></li>
    <li data-rlp="item-3"><span data-rlp="item-3-name">Ink refills, pack of 12</span><span data-rlp="item-3-qty">Qty 3</span><span data-rlp="item-3-price">$18.00</span><button type="button" class="secondary" data-rlp="item-3-remove" aria-label="Remove Ink refills">Remove</button></li>
  </ul>
  <div class="promo">
    <label for="promo" data-rlp="promo-label">Promo code</label>
    <input id="promo" type="text" data-rlp="promo-input" aria-describedby="promo-err">
    <button type="button" class="secondary" data-rlp="promo-apply">Apply</button>
    <p id="promo-err" class="error" data-rlp="promo-error" hidden>That code has expired.</p>
  </div>
  <section class="shipping" data-rlp="shipping">
    <h3 data-rlp="shipping-title">Shipping</h3>
    <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
    <div class="shipping-options" data-rlp="shipping-options" hidden>
      <div><input type="radio" id="ship-ground" name="ship" checked data-rlp="ship-ground-input"><label for="ship-ground" data-rlp="ship-ground-label">Ground — $6.00</label></div>
      <div><input type="radio" id="ship-air" name="ship" data-rlp="ship-air-input"><label for="ship-air" data-rlp="ship-air-label">Air — $19.00</label></div>
    </div>
  </section>
  <div class="total"><p data-rlp="total-label">Total</p><p data-rlp="total-value">$160.00</p></div>
  <button type="submit" class="place" data-rlp="place">Place order</button>
</section>
</body>
</html>
