<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  [hidden] { display: none !important; }
  body { padding: 1rem; }
  main { max-inline-size: 40rem; margin-inline: auto; }
  .summary { padding: 1.25rem; display: grid; gap: 1.5rem; min-inline-size: 0; }
  .summary > * { min-inline-size: 0; }
  .items { display: grid; gap: 0.75rem; }
  .item {
    display: grid; gap: 0.5rem 1rem; align-items: center;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "name price" "qty remove";
    padding-block-end: 0.75rem; border-block-end: 1px solid #c9c5bb;
  }
  .item .name { grid-area: name; font-weight: 600; }
  .item .qty { grid-area: qty; color: #4d544f; }
  .item .price { grid-area: price; text-align: end; white-space: nowrap; }
  .item .remove { grid-area: remove; justify-self: end; }
  @media (min-width: 36rem) {
    .item {
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      grid-template-areas: "name qty price remove";
    }
    .item .price { min-inline-size: 4.5rem; }
  }
  .promo { display: grid; gap: 0.5rem; }
  .promo-row { display: flex; gap: 0.75rem; align-items: flex-start; }
  .promo-row input { flex: 1 1 auto; }
  .promo-row button { flex: 0 0 auto; }
  .shipping { display: grid; gap: 0.75rem; }
  .shipping-options { display: grid; gap: 0.5rem; }
  .radio-row { display: flex; gap: 0.75rem; align-items: center; min-block-size: 2.75rem; }
  .radio-row input { flex: 0 0 auto; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; font-size: 1.25rem; font-weight: 700; padding-block-start: 1rem; border-block-start: 1px solid #c9c5bb; }
  .place { inline-size: 100%; }
  </style>
</head>
<body>
<main>
  <section class="surface summary" data-rlp="summary">
    <h2 data-rlp="title">Order summary</h2>
    <ul class="items" data-rlp="items">
      <li class="item" data-rlp="item-1">
        <span class="name" data-rlp="item-1-name">Linen notebook</span>
        <span class="qty" data-rlp="item-1-qty">Qty 2</span>
        <span class="price" data-rlp="item-1-price">$24.00</span>
        <button type="button" class="secondary remove" data-rlp="item-1-remove" aria-label="Remove Linen notebook">Remove</button>
      </li>
      <li class="item" data-rlp="item-2">
        <span class="name" data-rlp="item-2-name">Fountain pen</span>
        <span class="qty" data-rlp="item-2-qty">Qty 1</span>
        <span class="price" data-rlp="item-2-price">$58.00</span>
        <button type="button" class="secondary remove" data-rlp="item-2-remove" aria-label="Remove Fountain pen">Remove</button>
      </li>
      <li class="item" data-rlp="item-3">
        <span class="name" data-rlp="item-3-name">Ink refills, pack of 12</span>
        <span class="qty" data-rlp="item-3-qty">Qty 3</span>
        <span class="price" data-rlp="item-3-price">$18.00</span>
        <button type="button" class="secondary remove" data-rlp="item-3-remove" aria-label="Remove Ink refills">Remove</button>
      </li>
    </ul>
    <div class="promo">
      <label for="promo" data-rlp="promo-label">Promo code</label>
      <div class="promo-row">
        <input type="text" id="promo" data-rlp="promo-input" aria-describedby="promo-err">
        <button type="button" class="secondary" data-rlp="promo-apply">Apply</button>
      </div>
      <p class="error" id="promo-err" data-rlp="promo-error" hidden>That code has expired.</p>
    </div>
    <section class="shipping" data-rlp="shipping">
      <h3 data-rlp="shipping-title">Shipping</h3>
      <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
      <div class="shipping-options" data-rlp="shipping-options" hidden>
        <div class="radio-row">
          <input type="radio" name="ship" id="ship-ground" data-rlp="ship-ground-input" checked>
          <label for="ship-ground" data-rlp="ship-ground-label">Ground — $6.00</label>
        </div>
        <div class="radio-row">
          <input type="radio" name="ship" id="ship-air" data-rlp="ship-air-input">
          <label for="ship-air" data-rlp="ship-air-label">Air — $19.00</label>
        </div>
      </div>
    </section>
    <div class="total">
      <span data-rlp="total-label">Total</span>
      <span data-rlp="total-value">$160.00</span>
    </div>
    <button type="submit" class="place" data-rlp="place">Place order</button>
  </section>
</main>
</body>
</html>
