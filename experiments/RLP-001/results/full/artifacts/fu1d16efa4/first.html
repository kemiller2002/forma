<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation site header</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  header { padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem 1.5rem; }
  .brand { font-weight: 700; font-size: 1.25rem; text-decoration: none; padding: 0.5rem 0; min-height: 2.5rem; display: inline-flex; align-items: center; }
  nav { flex: 1 1 20rem; min-width: 0; }
  nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; }
  nav a { display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0.25rem 0.75rem; border-radius: 0.375rem; text-decoration: none; border-bottom: 3px solid transparent; }
  nav a[aria-current="page"] { font-weight: 700; border-bottom-color: currentColor; background: #eef2ff; }
  .search { display: flex; flex-direction: column; gap: 0.25rem; flex: 0 1 16rem; min-width: 0; }
  .search input { width: 100%; box-sizing: border-box; min-height: 2.5rem; }
  header button { min-height: 2.5rem; }
</style>
</head>
<body>
<header class="surface" data-rlp="header">
  <a class="brand" href="#" data-rlp="brand">Northwind Docs</a>
  <nav aria-label="Primary" data-rlp="nav">
    <ul>
      <li><a href="#" data-rlp="link-guides">Guides</a></li>
      <li><a href="#" aria-current="page" data-rlp="link-api">API reference</a></li>
      <li><a href="#" data-rlp="link-sdks">SDKs</a></li>
      <li><a href="#" data-rlp="link-integrations">Integrations and partner ecosystem</a></li>
      <li><a href="#" data-rlp="link-changelog">Changelog</a></li>
    </ul>
  </nav>
  <div class="search">
    <label for="search-input" data-rlp="search-label">Search documentation</label>
    <input type="search" id="search-input" data-rlp="search-input">
  </div>
  <button type="button" data-rlp="signin">Sign in</button>
</header>
</body>
</html>
