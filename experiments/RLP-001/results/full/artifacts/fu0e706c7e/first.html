<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deeply nested settings in a narrow column</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  .row-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--ef-primitive-spacing-2) var(--ef-primitive-spacing-3);align-items:start}
  .row-grid input{margin:0}
  .row-grid label,.row-grid .hint{overflow-wrap:anywhere;min-width:0}
  .row-grid .hint{grid-column:2;margin:0}
  .endpoint{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
  input[type=url],input[type=number]{max-width:100%;box-sizing:border-box}
  nav ul{list-style:none;margin:0;padding:0}
  nav a{display:inline-block;min-height:1.5rem;padding:var(--ef-primitive-spacing-1) 0}
  fieldset{min-width:0;margin:0}
</style>
</head>
<body>
<main data-rlp="page" class="ef-stack" style="padding:var(--ef-primitive-spacing-4)">
  <h1 data-rlp="page-title">Device settings</h1>
  <div data-rlp="layout" class="ef-sidebar" style="--ef-sidebar-width:14rem">
    <nav data-rlp="sidebar" class="ef-sidebar__side ef-surface" aria-label="Settings sections">
      <ul class="ef-stack" style="--ef-stack-gap:var(--ef-primitive-spacing-2)">
        <li><a data-rlp="side-1" href="#">General</a></li>
        <li><a data-rlp="side-2" href="#" aria-current="page">Sync</a></li>
        <li><a data-rlp="side-3" href="#">Security</a></li>
      </ul>
    </nav>
    <section data-rlp="content" class="ef-sidebar__content ef-surface ef-stack" style="min-width:0">
      <h2 data-rlp="sync-title">Sync</h2>
      <fieldset data-rlp="group" class="ef-surface ef-stack">
        <legend data-rlp="group-legend">Synchronization</legend>
        <div data-rlp="row" class="ef-surface row-grid">
          <input data-rlp="auto-input" id="auto" type="checkbox" aria-describedby="auto-hint">
          <label data-rlp="auto-label" for="auto">AutomaticallySynchronizeAcrossAllRegisteredDevicesAndWorkspaces</label>
          <p data-rlp="auto-hint" id="auto-hint" class="hint">Changes appear on every signed-in device within a minute.</p>
        </div>
        <div class="ef-field">
          <label data-rlp="endpoint-label" class="ef-field__label" for="endpoint">Sync endpoint URL (prefers at least 30rem of width)</label>
          <input data-rlp="endpoint-input" class="endpoint" id="endpoint" type="url" style="min-width:0">
        </div>
        <div class="ef-field">
          <label data-rlp="interval-label" class="ef-field__label" for="interval">Interval in minutes</label>
          <input data-rlp="interval-input" id="interval" type="number" min="1">
        </div>
      </fieldset>
      <div class="ef-actions"><button data-rlp="save" type="button">Save settings</button></div>
    </section>
  </div>
</main>
</body>
</html>
