<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:1rem}
  .summary{max-width:36rem;margin:0 auto;padding:1.25rem;display:grid;gap:1.25rem}
  .items{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
  .items li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:.75rem;row-gap:.25rem;align-items:start}
  .items li+li{border-top:1px solid #ddd;padding-top:.75rem}
  .iname{grid-column:1;overflow-wrap:anywhere}
  .iqty{grid-column:1;grid-row:2}
  .iprice{grid-column:2;grid-row:1;text-align:end}
  .items button{grid-column:3;grid-row:1;min-height:2rem;min-width:2rem}
  .promo{display:grid;gap:.5rem}
  .prow{display:flex;gap:.5rem;align-items:flex-start;flex-wrap:wrap}
  .prow input{flex:1 1 10rem;min-width:0;min-height:2.5rem;margin:0}
  .prow button{min-height:2.5rem;margin:0}
  .promo p{margin:0}
  .shipping{display:grid;gap:.5rem}
  .shipping h3,.summary h2{margin:0}
  .shipping [data-rlp=shipping-loading]{margin:0}
  .opts{display:grid;gap:.5rem}
  .opt{display:flex;gap:.5rem;align-items:center;min-height:1.5rem}
  .opt input{margin:0;width:1.5rem;height:1.5rem;flex:none}
  .opt label{display:block;padding:.125rem 0}
  .total{display:flex;justify-content:space-between;gap:.75rem;align-items:baseline;flex-wrap:wrap;font-weight:600}
  .place{width:100%;min-height:2.75rem}

</style>
</head>
<body>
  <section class="surface summary" data-rlp="summary">
  <h2 data-rlp="title">Order summary</h2>
  <ul class="items" data-rlp="items">
    <li data-rlp="item-1"><span class="iname" data-rlp="item-1-name">Linen notebook</span><span class="iqty" data-rlp="item-1-qty">Qty 2</span><span class="iprice" data-rlp="item-1-price">$24.00</span><button type="button" class="secondary" data-rlp="item-1-remove" aria-label="Remove Linen notebook">Remove</button></li>
    <li data-rlp="item-2"><span class="iname" data-rlp="item-2-name">Fountain pen</span><span class="iqty" data-rlp="item-2-qty">Qty 1</span><span class="iprice" data-rlp="item-2-price">$58.00</span><button type="button" class="secondary" data-rlp="item-2-remove" aria-label="Remove Fountain pen">Remove</button></li>
    <li data-rlp="item-3"><span class="iname" data-rlp="item-3-name">Ink refills, pack of 12</span><span class="iqty" data-rlp="item-3-qty">Qty 3</span><span class="iprice" data-rlp="item-3-price">$18.00</span><button type="button" class="secondary" data-rlp="item-3-remove" aria-label="Remove Ink refills">Remove</button></li>
  </ul>
  <div class="promo">
    <label for="promo" data-rlp="promo-label">Promo code</label>
    <div class="prow">
      <input type="text" id="promo" data-rlp="promo-input" aria-describedby="promo-err">
      <button type="button" class="secondary" data-rlp="promo-apply">Apply</button>
    </div>
    <p class="error" id="promo-err" data-rlp="promo-error" hidden>That code has expired.</p>
  </div>
  <section class="shipping" data-rlp="shipping">
    <h3 data-rlp="shipping-title">Shipping</h3>
    <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
    <div class="opts" data-rlp="shipping-options" hidden>
      <div class="opt"><input type="radio" name="ship" id="ship-ground" data-rlp="ship-ground-input" checked><label for="ship-ground" data-rlp="ship-ground-label">Ground — $6.00</label></div>
      <div class="opt"><input type="radio" name="ship" id="ship-air" data-rlp="ship-air-input"><label for="ship-air" data-rlp="ship-air-label">Air — $19.00</label></div>
    </div>
  </section>
  <div class="total"><span data-rlp="total-label">Total</span><span data-rlp="total-value">$160.00</span></div>
  <button type="submit" class="place" data-rlp="place">Place order</button>
</section>
</body>
</html>
