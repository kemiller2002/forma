<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace section navigation</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  .bar{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"crumb" "head" "secs" "acts";gap:var(--ef-primitive-spacing-4);align-items:center}
  .bar>.crumbs{grid-area:crumb}
  .bar>h1{grid-area:head;margin:0;min-width:0;overflow-wrap:anywhere}
  .bar>.sections{grid-area:secs}
  .bar>.actions{grid-area:acts}
  .crumbs ol{list-style:none;margin:0;padding:0}
  .sections ul{list-style:none;margin:0;padding:0}
  .crumbs a,.sections a{display:inline-block;min-height:1.5rem;padding:var(--ef-primitive-spacing-1)}
</style>
</head>
<body>
  <header class="bar ef-surface" data-rlp="bar">
  <nav class="crumbs" aria-label="Breadcrumb" data-rlp="breadcrumb">
    <ol class="ef-cluster" style="--ef-cluster-gap:var(--ef-primitive-spacing-2)">
      <li><a href="#" data-rlp="crumb-1">Workspaces</a></li>
      <li><a href="#" data-rlp="crumb-2">Acme Corporation</a></li>
      <li><a href="#" data-rlp="crumb-3">Billing</a></li>
      <li><span aria-current="page" data-rlp="crumb-4">Invoices</span></li>
    </ol>
  </nav>
  <h1 data-rlp="heading">Invoices</h1>
  <nav class="sections" aria-label="Billing sections" data-rlp="sections">
    <ul class="ef-cluster" style="--ef-cluster-gap:var(--ef-primitive-spacing-2)">
      <li><a href="#" data-rlp="section-1">Overview</a></li>
      <li><a href="#" aria-current="page" data-rlp="section-2">Invoices</a></li>
      <li><a href="#" data-rlp="section-3">Payment methods</a></li>
      <li><a href="#" data-rlp="section-4">Tax registrations and exemptions</a></li>
      <li><a href="#" data-rlp="section-5">Usage</a></li>
      <li><a href="#" data-rlp="section-6">Settings</a></li>
    </ul>
  </nav>
  <div class="actions ef-actions" data-rlp="actions">
    <button type="button" class="secondary" data-rlp="export">Export CSV</button>
    <button type="button" data-rlp="new">New invoice</button>
  </div>
</header>
</body>
</html>
