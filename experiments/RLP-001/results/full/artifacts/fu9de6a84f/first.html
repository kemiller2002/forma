<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comment thread with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  main { padding: var(--ef-primitive-spacing-4); }
  .comments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--ef-primitive-spacing-4); }
  .comment { display: flex; align-items: flex-start; gap: var(--ef-primitive-spacing-3); }
  .avatar { width: 2.5rem; height: 2.5rem; aspect-ratio: 1 / 1; flex: none; }
  .comment__main { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
  .comment__main p, .meta { margin: 0; }
  .ef-field textarea { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
  <main>
    <section data-rlp="thread" class="ef-surface ef-stack">
      <h2 data-rlp="title">Discussion</h2>
      <ol data-rlp="comments" class="comments">
        <li data-rlp="comment-1" class="comment">
          <img data-rlp="comment-1-avatar" class="avatar" src="assets/placeholder.svg" alt="" width="40" height="40">
          <div class="ef-stack comment__main" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
            <p class="ef-cluster meta" style="--ef-cluster-gap: var(--ef-primitive-spacing-2)"><strong data-rlp="comment-1-author">Priya</strong> <span data-rlp="comment-1-time">3 hours ago</span></p>
            <p data-rlp="comment-1-body">Can we ship the migration behind a flag first?</p>
            <div class="ef-actions"><button type="button" class="secondary" data-rlp="comment-1-reply" aria-label="Reply to Priya">Reply</button></div>
          </div>
        </li>
        <li data-rlp="comment-2" class="comment">
          <img data-rlp="comment-2-avatar" class="avatar" src="assets/placeholder.svg" alt="" width="40" height="40">
          <div class="ef-stack comment__main" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
            <p class="ef-cluster meta" style="--ef-cluster-gap: var(--ef-primitive-spacing-2)"><strong data-rlp="comment-2-author">Marcus</strong> <span data-rlp="comment-2-time">2 hours ago</span></p>
            <p data-rlp="comment-2-body">Agreed. I added a flag to the rollout plan.</p>
            <div class="ef-actions"><button type="button" class="secondary" data-rlp="comment-2-reply" aria-label="Reply to Marcus">Reply</button></div>
          </div>
        </li>
        <li data-rlp="comment-3" class="comment">
          <img data-rlp="comment-3-avatar" class="avatar" src="assets/placeholder.svg" alt="" width="40" height="40">
          <div class="ef-stack comment__main" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
            <p class="ef-cluster meta" style="--ef-cluster-gap: var(--ef-primitive-spacing-2)"><strong data-rlp="comment-3-author">Lena</strong> <span data-rlp="comment-3-time">1 hour ago</span></p>
            <p data-rlp="comment-3-body">Looks good to me.</p>
            <div class="ef-actions"><button type="button" class="secondary" data-rlp="comment-3-reply" aria-label="Reply to Lena">Reply</button></div>
          </div>
        </li>
      </ol>
      <p data-rlp="more-status" role="status">Loading earlier comments…</p>
      <div class="ef-field">
        <label for="composer-input" class="ef-field__label" data-rlp="composer-label">Add a comment</label>
        <textarea id="composer-input" data-rlp="composer-input" rows="3" aria-describedby="composer-error"></textarea>
        <p id="composer-error" class="error ef-validation-message" data-rlp="composer-error" hidden>Write a comment before posting.</p>
      </div>
      <div class="ef-actions"><button type="button" data-rlp="post">Post comment</button></div>
    </section>
  </main>
</body>
</html>
