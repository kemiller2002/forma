<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping address form</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
  form { padding: 1.5rem; display: grid; gap: 1.5rem; }
  h2 { margin: 0; }
  .field { display: grid; gap: 0.375rem; align-content: start; min-width: 0; }
  .field input, .field select { width: 100%; min-width: 0; box-sizing: border-box; }
  .row { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  .addr { display: grid; gap: 1rem; }
  .loc { display: grid; gap: 0.5rem; }
  .loc .row { gap: 1rem; }
  @media (min-width: 40rem) {
    .loc .row { grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 1rem; row-gap: 0.375rem; }
    .loc .row .field { grid-row: span 2; grid-template-rows: subgrid; row-gap: 0.375rem; gap: 0.375rem; }
  }
  fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: grid; gap: 1rem; }
  legend { padding: 0; margin: 0 0 0.75rem; }
  .opt { display: grid; grid-template-columns: auto 1fr; column-gap: 0.75rem; row-gap: 0.25rem; align-items: start; }
  .opt input { grid-row: 1 / span 2; grid-column: 1; margin: 0; min-width: 1.5rem; min-height: 1.5rem; }
  .opt label { grid-column: 2; grid-row: 1; }
  .opt .note { grid-column: 2; grid-row: 2; margin: 0; }
  .save { display: grid; grid-template-columns: auto 1fr; column-gap: 0.75rem; align-items: center; }
  .save input { margin: 0; min-width: 1.5rem; min-height: 1.5rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: flex-end; }
  .actions button { min-height: 2.75rem; }
  .error { margin: 0; }
  </style>
</head>
<body>
  <main>
  <form class="surface" data-rlp="form" novalidate>
    <h2 data-rlp="title">Shipping address</h2>
    <div class="addr">
      <div class="field">
        <label for="street" data-rlp="street-label">Street address *</label>
        <input id="street" type="text" autocomplete="address-line1" required data-rlp="street-input">
      </div>
      <div class="field">
        <label for="unit" data-rlp="unit-label">Apartment, suite, or unit</label>
        <input id="unit" type="text" autocomplete="address-line2" data-rlp="unit-input">
      </div>
    </div>
    <div class="loc">
      <div class="row">
        <div class="field">
          <label for="city" data-rlp="city-label">City *</label>
          <input id="city" type="text" autocomplete="address-level2" required data-rlp="city-input">
        </div>
        <div class="field">
          <label for="state" data-rlp="state-label">State *</label>
          <select id="state" data-rlp="state-input">
            <option value="">Choose a state</option>
            <option value="OH">Ohio</option>
            <option value="OR">Oregon</option>
            <option value="TX">Texas</option>
          </select>
        </div>
        <div class="field">
          <label for="zip" data-rlp="zip-label">ZIP code *</label>
          <input id="zip" type="text" inputmode="numeric" autocomplete="postal-code" required aria-describedby="zip-error" data-rlp="zip-input">
        </div>
      </div>
      <p id="zip-error" class="error" hidden data-rlp="zip-error">Enter a five-digit ZIP code.</p>
    </div>
    <fieldset data-rlp="delivery">
      <legend data-rlp="delivery-legend">Delivery speed</legend>
      <div class="opt">
        <input type="radio" id="standard" name="speed" checked aria-describedby="standard-note" data-rlp="standard-input">
        <label for="standard" data-rlp="standard-label">Standard — free</label>
        <p class="note" id="standard-note" data-rlp="standard-note">Arrives in 5 to 7 business days.</p>
      </div>
      <div class="opt">
        <input type="radio" id="express" name="speed" aria-describedby="express-note" data-rlp="express-input">
        <label for="express" data-rlp="express-label">Express — $12.00</label>
        <p class="note" id="express-note" data-rlp="express-note">Arrives in 2 business days.</p>
      </div>
    </fieldset>
    <div class="save">
      <input type="checkbox" id="save" data-rlp="save-input">
      <label for="save" data-rlp="save-label">Save this address for next time</label>
    </div>
    <div class="actions" data-rlp="actions">
      <button type="button" class="secondary" data-rlp="back">Back to cart</button>
      <button type="submit" data-rlp="continue">Continue to payment</button>
    </div>
  </form>
  </main>
</body>
</html>
