<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
  .summary { padding: 1.25rem; display: grid; gap: 1.5rem; }
  .summary > * { min-width: 0; }
  .summary h2, .summary h3 { margin: 0; }
  .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
  .items li { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name price" "qty remove"; gap: 0.5rem 1rem; align-items: center; }
  .items li > [data-rlp$="-name"] { grid-area: name; overflow-wrap: anywhere; }
  .items li > [data-rlp$="-qty"] { grid-area: qty; }
  .items li > [data-rlp$="-price"] { grid-area: price; text-align: end; }
  .items li > button { grid-area: remove; justify-self: end; min-height: 2.25rem; min-width: 1.5rem; }
  @media (min-width: 36rem) {
    .items li { grid-template-columns: minmax(0, 1fr) auto auto auto; grid-template-areas: "name qty price remove"; }
    .items li > [data-rlp$="-price"] { min-width: 4rem; }
  }
  .promo { display: grid; gap: 0.5rem; }
  .promo-row { display: flex; gap: 0.5rem; align-items: flex-start; }
  .promo-row input { flex: 1 1 auto; min-width: 0; min-height: 2.25rem; box-sizing: border-box; }
  .promo-row button { flex: none; min-height: 2.25rem; box-sizing: border-box; }
  .promo-error { margin: 0; }
  .shipping { display: grid; gap: 0.75rem; }
  .shipping p { margin: 0; }
  .ship-options { display: grid; gap: 0.5rem; }
  .ship-options[hidden], .promo-error[hidden], .shipping p[hidden] { display: none; }
  .ship-opt { display: flex; gap: 0.5rem; align-items: center; min-height: 1.5rem; }
  .ship-opt input { flex: none; margin: 0; }
  .total { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1rem; font-weight: 600; }
  .place { width: 100%; min-height: 2.75rem; }
  </style>
</head>
<body>
<main>
  <section class="surface summary" data-rlp="summary">
    <h2 data-rlp="title">Order summary</h2>
    <ul class="items" data-rlp="items">
      <li data-rlp="item-1">
        <span data-rlp="item-1-name">Linen notebook</span>
        <span data-rlp="item-1-qty">Qty 2</span>
        <span data-rlp="item-1-price">$24.00</span>
        <button type="button" class="secondary" data-rlp="item-1-remove" aria-label="Remove Linen notebook">Remove</button>
      </li>
      <li data-rlp="item-2">
        <span data-rlp="item-2-name">Fountain pen</span>
        <span data-rlp="item-2-qty">Qty 1</span>
        <span data-rlp="item-2-price">$58.00</span>
        <button type="button" class="secondary" data-rlp="item-2-remove" aria-label="Remove Fountain pen">Remove</button>
      </li>
      <li data-rlp="item-3">
        <span data-rlp="item-3-name">Ink refills, pack of 12</span>
        <span data-rlp="item-3-qty">Qty 3</span>
        <span data-rlp="item-3-price">$18.00</span>
        <button type="button" class="secondary" data-rlp="item-3-remove" aria-label="Remove Ink refills">Remove</button>
      </li>
    </ul>
    <div class="promo">
      <label for="promo-input" data-rlp="promo-label">Promo code</label>
      <div class="promo-row">
        <input type="text" id="promo-input" data-rlp="promo-input" aria-describedby="promo-error">
        <button type="button" class="secondary" data-rlp="promo-apply">Apply</button>
      </div>
      <p class="error promo-error" id="promo-error" data-rlp="promo-error" hidden>That code has expired.</p>
    </div>
    <section class="shipping" data-rlp="shipping">
      <h3 data-rlp="shipping-title">Shipping</h3>
      <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
      <div class="ship-options" data-rlp="shipping-options" hidden>
        <div class="ship-opt">
          <input type="radio" name="ship" id="ship-ground" data-rlp="ship-ground-input" checked>
          <label for="ship-ground" data-rlp="ship-ground-label">Ground — $6.00</label>
        </div>
        <div class="ship-opt">
          <input type="radio" name="ship" id="ship-air" data-rlp="ship-air-input">
          <label for="ship-air" data-rlp="ship-air-label">Air — $19.00</label>
        </div>
      </div>
    </section>
    <div class="total">
      <span data-rlp="total-label">Total</span>
      <span data-rlp="total-value">$160.00</span>
    </div>
    <button type="submit" class="place" data-rlp="place">Place order</button>
  </section>
</main>
</body>
</html>
