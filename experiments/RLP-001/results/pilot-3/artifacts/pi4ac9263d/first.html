<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  main { padding: var(--ef-primitive-spacing-4); }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ef-primitive-spacing-2) var(--ef-primitive-spacing-4); }
  .item .name { flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere; }
  .item .price { margin-inline-start: auto; }
  .promo-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--ef-primitive-spacing-2); }
  .promo-row input { flex: 1 1 10rem; min-width: 0; }
  .total-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ef-primitive-spacing-2); }
  .radio-row { display: flex; align-items: center; gap: var(--ef-primitive-spacing-2); }
</style>
</head>
<body>
  <main>
  <section class="ef-surface ef-stack" data-rlp="summary" style="max-width: 40rem; margin-inline: auto;">
    <h2 data-rlp="title">Order summary</h2>
    <ul class="items ef-stack" data-rlp="items">
      <li class="item" data-rlp="item-1">
        <span class="name" data-rlp="item-1-name">Linen notebook</span>
        <span data-rlp="item-1-qty">Qty 2</span>
        <span class="price" data-rlp="item-1-price">$24.00</span>
        <button type="button" class="secondary" data-rlp="item-1-remove" aria-label="Remove Linen notebook">Remove</button>
      </li>
      <li class="item" data-rlp="item-2">
        <span class="name" data-rlp="item-2-name">Fountain pen</span>
        <span data-rlp="item-2-qty">Qty 1</span>
        <span class="price" data-rlp="item-2-price">$58.00</span>
        <button type="button" class="secondary" data-rlp="item-2-remove" aria-label="Remove Fountain pen">Remove</button>
      </li>
      <li class="item" data-rlp="item-3">
        <span class="name" data-rlp="item-3-name">Ink refills, pack of 12</span>
        <span data-rlp="item-3-qty">Qty 3</span>
        <span class="price" data-rlp="item-3-price">$18.00</span>
        <button type="button" class="secondary" data-rlp="item-3-remove" aria-label="Remove Ink refills">Remove</button>
      </li>
    </ul>

    <div class="ef-stack" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
      <label for="promo-input" data-rlp="promo-label">Promo code</label>
      <div class="promo-row">
        <input type="text" id="promo-input" data-rlp="promo-input" aria-describedby="promo-error">
        <button type="button" class="secondary" data-rlp="promo-apply">Apply</button>
      </div>
      <p class="error" id="promo-error" data-rlp="promo-error" hidden>That code has expired.</p>
    </div>

    <section class="ef-stack" data-rlp="shipping" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
      <h3 data-rlp="shipping-title">Shipping</h3>
      <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
      <div class="ef-stack" data-rlp="shipping-options" hidden style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
        <div class="radio-row">
          <input type="radio" name="ship" id="ship-ground" data-rlp="ship-ground-input" checked>
          <label for="ship-ground" data-rlp="ship-ground-label">Ground — $6.00</label>
        </div>
        <div class="radio-row">
          <input type="radio" name="ship" id="ship-air" data-rlp="ship-air-input">
          <label for="ship-air" data-rlp="ship-air-label">Air — $19.00</label>
        </div>
      </div>
    </section>

    <div class="total-row">
      <span data-rlp="total-label">Total</span>
      <span data-rlp="total-value">$160.00</span>
    </div>
    <div class="ef-actions">
      <button type="submit" data-rlp="place">Place order</button>
    </div>
  </section>
  </main>
</body>
</html>
