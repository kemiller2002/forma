<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create-account form</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
  body{padding:1rem}
  .form{max-width:46rem;margin:0 auto;padding:1.5rem;display:grid;gap:1.5rem}
  .form h1{margin:0}
  .row{display:grid;grid-template-columns:1fr;gap:1.25rem}
  .field{display:grid;row-gap:.375rem;align-content:start;min-width:0}
  .field>*{min-width:0;overflow-wrap:anywhere}
  .field input{width:100%}
  .field .stack{display:grid;gap:.375rem;align-content:start}
  @media (min-width:40rem){
    .row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;column-gap:1.25rem;row-gap:.375rem}
    .row>.field{grid-row:span 3;grid-template-rows:subgrid;row-gap:.375rem}
  }
  fieldset.prefs{border:0;margin:0;padding:0;min-width:0;display:grid;gap:.5rem}
  .prefs legend{padding:0;margin-bottom:.5rem;font-weight:600}
  .check{display:flex;align-items:center;gap:.5rem;min-height:1.5rem}
  .check input{width:1.5rem;height:1.5rem;margin:0;flex:none}
  .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.75rem}
  .actions button{min-height:2.5rem;min-width:6rem}

</style>
</head>
<body>
  <main>
<form class="surface form" data-rlp="form" novalidate>
  <h1 data-rlp="title">Create your account</h1>
  <p data-rlp="intro">All fields marked with an asterisk are required.</p>
  <div class="row">
    <div class="field">
        <label data-rlp="name-label" for="name">Full name *</label>
        <input data-rlp="name-input" id="name" name="name" type="text" autocomplete="name" required>
        <span></span>
      </div>
    <div class="field">
        <label data-rlp="email-label" for="email">Email address *</label>
        <input data-rlp="email-input" id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
        <p class="error" id="email-error" data-rlp="email-error" role="alert" hidden>Enter an email address in the format name@example.com.</p>
      </div>
  </div>
  <div class="row">
    <div class="field">
        <label data-rlp="password-label" for="password">Password *</label>
        <input data-rlp="password-input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error">
        <div class="stack"><p id="password-hint" data-rlp="password-hint">Use at least 12 characters.</p><p class="error" id="password-error" data-rlp="password-error" role="alert" hidden>Your password is too short.</p></div>
      </div>
    <div class="field">
        <label data-rlp="confirm-label" for="confirm">Confirm password *</label>
        <input data-rlp="confirm-input" id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        <span></span>
      </div>
  </div>
  <fieldset class="prefs" data-rlp="prefs">
    <legend data-rlp="prefs-legend">Email preferences</legend>
    <div class="check"><input type="checkbox" id="pref-news" name="news" data-rlp="pref-news-input"><label for="pref-news" data-rlp="pref-news-label">Product news</label></div>
    <div class="check"><input type="checkbox" id="pref-tips" name="tips" data-rlp="pref-tips-input"><label for="pref-tips" data-rlp="pref-tips-label">Tips and tutorials</label></div>
  </fieldset>
  <div class="actions" data-rlp="actions">
    <button type="button" class="secondary" data-rlp="cancel">Cancel</button>
    <button type="submit" data-rlp="submit">Create account</button>
  </div>
</form>
</main>
</body>
</html>
