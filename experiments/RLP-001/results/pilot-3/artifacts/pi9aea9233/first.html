<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create-account form</title>
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/forma.css">
  <style>
  /* your CSS */
</style>
</head>
<body>
  <main style="padding: var(--ef-primitive-spacing-4)">
<form class="ef-form ef-surface" data-rlp="form" style="--ef-form-max: 40rem; margin-inline: auto" novalidate>
  <h1 data-rlp="title">Create your account</h1>
  <p data-rlp="intro">All fields marked with an asterisk are required.</p>
  <div class="ef-form-row">
    <div class="ef-field">
      <label class="ef-field__label" for="name" data-rlp="name-label">Full name *</label>
      <input id="name" type="text" autocomplete="name" required data-rlp="name-input">
    </div>
    <div class="ef-field">
      <label class="ef-field__label" for="email" data-rlp="email-label">Email address *</label>
      <input id="email" type="email" autocomplete="email" required aria-describedby="email-error" data-rlp="email-input">
      <p class="error ef-validation-message" id="email-error" hidden data-rlp="email-error">Enter an email address in the format name@example.com.</p>
    </div>
  </div>
  <div class="ef-form-row">
    <div class="ef-field">
      <label class="ef-field__label" for="password" data-rlp="password-label">Password *</label>
      <p class="ef-field__description" id="password-hint" data-rlp="password-hint">Use at least 12 characters.</p>
      <input id="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error" data-rlp="password-input">
      <p class="error ef-validation-message" id="password-error" hidden data-rlp="password-error">Your password is too short.</p>
    </div>
    <div class="ef-field">
      <label class="ef-field__label" for="confirm" data-rlp="confirm-label">Confirm password *</label>
      <input id="confirm" type="password" autocomplete="new-password" required data-rlp="confirm-input">
    </div>
  </div>
  <fieldset class="ef-stack" data-rlp="prefs" style="--ef-stack-gap: var(--ef-primitive-spacing-2); border: 0; margin: 0; padding: 0; min-inline-size: 0">
    <legend data-rlp="prefs-legend" style="padding: 0; margin-block-end: var(--ef-primitive-spacing-2)">Email preferences</legend>
    <div class="ef-cluster" style="--ef-cluster-gap: var(--ef-primitive-spacing-2); flex-wrap: nowrap; align-items: center">
      <input id="pref-news" type="checkbox" data-rlp="pref-news-input" style="flex: none; inline-size: 1.5rem; block-size: 1.5rem; margin: 0">
      <label for="pref-news" data-rlp="pref-news-label">Product news</label>
    </div>
    <div class="ef-cluster" style="--ef-cluster-gap: var(--ef-primitive-spacing-2); flex-wrap: nowrap; align-items: center">
      <input id="pref-tips" type="checkbox" data-rlp="pref-tips-input" style="flex: none; inline-size: 1.5rem; block-size: 1.5rem; margin: 0">
      <label for="pref-tips" data-rlp="pref-tips-label">Tips and tutorials</label>
    </div>
  </fieldset>
  <div class="ef-actions" data-rlp="actions">
    <button type="button" class="secondary" data-rlp="cancel">Cancel</button>
    <button type="submit" data-rlp="submit">Create account</button>
  </div>
</form>
</main>
</body>
</html>
