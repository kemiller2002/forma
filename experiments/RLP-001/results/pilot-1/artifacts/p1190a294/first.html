<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout summary with dynamic content</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
  .card { padding: 1.25rem; display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }
  .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  .items li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #ddd; }
  .items li:last-child { border-bottom: 0; padding-bottom: 0; }
  .name { flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere; }
  .price { margin-left: auto; text-align: end; }
  .items button { min-height: 2rem; min-width: 1.5rem; }
  .promo { display: flex; flex-direction: column; gap: 0.5rem; }
  .promo-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-start; }
  .promo-row input { flex: 1 1 10rem; min-width: 0; box-sizing: border-box; min-height: 2.5rem; margin: 0; }
  .promo-row button { min-height: 2.5rem; min-width: 1.5rem; margin: 0; }
  .promo p, .shipping p { margin: 0; }
  .shipping { display: flex; flex-direction: column; gap: 0.75rem; }
  .shipping h3 { margin: 0; }
  .shipping-options { display: flex; flex-direction: column; gap: 0.5rem; }
  .opt { display: flex; align-items: center; gap: 0.5rem; }
  .opt input { margin: 0; flex: none; }
  .total { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h2 { margin: 0; }
  .place { align-self: stretch; min-height: 2.75rem; }
  </style>
</head>
<body>
<main>
<section class="surface card" data-rlp="summary" aria-labelledby="t">
  <h2 id="t" data-rlp="title">Order summary</h2>
  <ul class="items" data-rlp="items">
    <li data-rlp="item-1"><span class="name" data-rlp="item-1-name">Linen notebook</span><span data-rlp="item-1-qty">Qty 2</span><span class="price" data-rlp="item-1-price">$24.00</span><button type="button" class="secondary" data-rlp="item-1-remove" aria-label="Remove Linen notebook">Remove</button></li>
    <li data-rlp="item-2"><span class="name" data-rlp="item-2-name">Fountain pen</span><span data-rlp="item-2-qty">Qty 1</span><span class="price" data-rlp="item-2-price">$58.00</span><button type="button" class="secondary" data-rlp="item-2-remove" aria-label="Remove Fountain pen">Remove</button></li>
    <li data-rlp="item-3"><span class="name" data-rlp="item-3-name">Ink refills, pack of 12</span><span data-rlp="item-3-qty">Qty 3</span><span class="price" data-rlp="item-3-price">$18.00</span><button type="button" class="secondary" data-rlp="item-3-remove" aria-label="Remove Ink refills">Remove</button></li>
  </ul>
  <div class="promo">
    <label for="promo" data-rlp="promo-label">Promo code</label>
    <div class="promo-row">
      <input type="text" id="promo" data-rlp="promo-input" aria-describedby="promo-err">
      <button type="button" class="secondary" data-rlp="promo-apply">Apply</button>
    </div>
    <p class="error" id="promo-err" data-rlp="promo-error" hidden>That code has expired.</p>
  </div>
  <section class="shipping" data-rlp="shipping">
    <h3 data-rlp="shipping-title">Shipping</h3>
    <p role="status" data-rlp="shipping-loading">Calculating shipping options…</p>
    <div class="shipping-options" data-rlp="shipping-options" hidden>
      <div class="opt"><input type="radio" name="ship" id="ship-ground" data-rlp="ship-ground-input" checked><label for="ship-ground" data-rlp="ship-ground-label">Ground — $6.00</label></div>
      <div class="opt"><input type="radio" name="ship" id="ship-air" data-rlp="ship-air-input"><label for="ship-air" data-rlp="ship-air-label">Air — $19.00</label></div>
    </div>
  </section>
  <div class="total"><span data-rlp="total-label">Total</span><span data-rlp="total-value">$160.00</span></div>
  <button type="submit" class="place" data-rlp="place">Place order</button>
</section>
</main>
</body>
</html>
