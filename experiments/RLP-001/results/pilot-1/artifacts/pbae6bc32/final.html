<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create-account form</title>
  <link rel="stylesheet" href="assets/forma.css">
  <link rel="stylesheet" href="assets/base.css">
  <style>
  main { padding: var(--ef-primitive-spacing-4); }
  .ef-form-row > .ef-field > input { margin-block-start: var(--ef-primitive-spacing-2); }
  .ef-form-row > .ef-field > .ef-validation-message { margin-block-start: var(--ef-primitive-spacing-2); }
  .hint { font-size: 0.8125rem; line-height: 1.4; color: #3a403c; }
  .pref { --ef-cluster-gap: var(--ef-primitive-spacing-2); }
  .pref input { inline-size: 1.5rem; block-size: 1.5rem; margin: 0; flex: none; }
  fieldset.prefs { border: 0; padding: 0; margin: 0; }
  fieldset.prefs legend { padding: 0; margin-block-end: var(--ef-primitive-spacing-2); font-weight: 700; }
</style>
</head>
<body>
<main>
  <form class="ef-surface ef-form" data-rlp="form" style="--ef-surface-space: var(--ef-primitive-spacing-5)" novalidate>
    <h1 data-rlp="title">Create your account</h1>
    <p data-rlp="intro">All fields marked with an asterisk are required.</p>
    <div class="ef-form-row">
      <div class="ef-field">
        <label class="ef-field__label" for="name" data-rlp="name-label">Full name *</label>
        <input id="name" type="text" autocomplete="name" required data-rlp="name-input">
      </div>
      <div class="ef-field">
        <label class="ef-field__label" for="email" data-rlp="email-label">Email address *</label>
        <input id="email" type="email" autocomplete="email" required aria-describedby="email-error" data-rlp="email-input">
        <p class="ef-validation-message error" id="email-error" hidden data-rlp="email-error">Enter an email address in the format name@example.com.</p>
      </div>
    </div>
    <div class="ef-form-row">
      <div class="ef-field">
        <label class="ef-field__label" for="password" data-rlp="password-label">Password *</label>
        <input id="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error" data-rlp="password-input">
        <div class="ef-validation-message ef-stack" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
          <p class="hint" id="password-hint" data-rlp="password-hint">Use at least 12 characters.</p>
          <p class="error" id="password-error" hidden data-rlp="password-error">Your password is too short.</p>
        </div>
      </div>
      <div class="ef-field">
        <label class="ef-field__label" for="confirm" data-rlp="confirm-label">Confirm password *</label>
        <input id="confirm" type="password" autocomplete="new-password" required data-rlp="confirm-input">
      </div>
    </div>
    <fieldset class="prefs ef-stack" data-rlp="prefs" style="--ef-stack-gap: var(--ef-primitive-spacing-2)">
      <legend data-rlp="prefs-legend">Email preferences</legend>
      <div class="pref ef-cluster">
        <input type="checkbox" id="pref-news" data-rlp="pref-news-input">
        <label for="pref-news" data-rlp="pref-news-label">Product news</label>
      </div>
      <div class="pref ef-cluster">
        <input type="checkbox" id="pref-tips" data-rlp="pref-tips-input">
        <label for="pref-tips" data-rlp="pref-tips-label">Tips and tutorials</label>
      </div>
    </fieldset>
    <div class="ef-actions" data-rlp="actions">
      <button type="button" class="secondary" data-rlp="cancel">Cancel</button>
      <button type="submit" data-rlp="submit">Create account</button>
    </div>
  </form>
</main>
</body>
</html>
