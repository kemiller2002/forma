<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create-account form</title>
  <link rel="stylesheet" href="assets/base.css">
  <style>
  body { padding: 1rem; }
  .form { max-inline-size: 44rem; margin-inline: auto; padding: 1.5rem; display: grid; gap: 1.5rem; }
  .head { display: grid; gap: 0.5rem; }
  .row { display: grid; grid-template-columns: 1fr; column-gap: 1.25rem; row-gap: 1.25rem; }
  .field { display: grid; grid-template-rows: auto auto auto auto; align-content: start; min-inline-size: 0; }
  .field label { margin-block-end: 0.375rem; align-self: end; }
  .field .msg { margin-block-start: 0.375rem; }
  .field .msg[hidden] { display: none; }
  @media (min-width: 40rem) {
    .row { grid-template-columns: 1fr 1fr; row-gap: 0; }
    .field { grid-row: span 4; grid-template-rows: subgrid; row-gap: 0; }
  }
  .prefs { display: grid; gap: 0.5rem; min-inline-size: 0; }
  .prefs legend { font-weight: 600; margin-block-end: 0.5rem; }
  .check { display: flex; align-items: center; gap: 0.625rem; min-block-size: 2.75rem; }
  .check input { flex: none; }
  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.75rem; }
  </style>
</head>
<body>
  <form class="surface form" data-rlp="form" novalidate>
    <div class="head">
      <h1 data-rlp="title">Create your account</h1>
      <p data-rlp="intro">All fields marked with an asterisk are required.</p>
    </div>

    <div class="row">
      <div class="field">
        <label for="name" data-rlp="name-label">Full name *</label>
        <input id="name" data-rlp="name-input" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email" data-rlp="email-label">Email address *</label>
        <input id="email" data-rlp="email-input" type="email" autocomplete="email" required aria-describedby="email-error">
        <p id="email-error" class="error msg" data-rlp="email-error" hidden>Enter an email address in the format name@example.com.</p>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="password" data-rlp="password-label">Password *</label>
        <input id="password" data-rlp="password-input" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error">
        <p id="password-hint" class="muted msg" data-rlp="password-hint">Use at least 12 characters.</p>
        <p id="password-error" class="error msg" data-rlp="password-error" hidden>Your password is too short.</p>
      </div>
      <div class="field">
        <label for="confirm" data-rlp="confirm-label">Confirm password *</label>
        <input id="confirm" data-rlp="confirm-input" type="password" autocomplete="new-password" required>
      </div>
    </div>

    <fieldset class="prefs" data-rlp="prefs">
      <legend data-rlp="prefs-legend">Email preferences</legend>
      <div class="check">
        <input type="checkbox" id="pref-news" data-rlp="pref-news-input">
        <label for="pref-news" data-rlp="pref-news-label">Product news</label>
      </div>
      <div class="check">
        <input type="checkbox" id="pref-tips" data-rlp="pref-tips-input">
        <label for="pref-tips" data-rlp="pref-tips-label">Tips and tutorials</label>
      </div>
    </fieldset>

    <div class="actions" data-rlp="actions">
      <button type="button" class="secondary" data-rlp="cancel">Cancel</button>
      <button type="submit" data-rlp="submit">Create account</button>
    </div>
  </form>
</body>
</html>
