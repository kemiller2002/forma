name: Validate Forma feature branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-forma-feature.yml"

permissions:
  contents: read

concurrency:
  group: validate-forma-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-forma:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for commit batch
        run: sleep 600
      - uses: actions/checkout@v4
        with:
          ref: feature/component-showcase-site
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test tooling
        run: npm install --ignore-scripts=false

      - name: Restore token compiler
        run: dotnet restore tools/TokenCompiler/TokenCompiler.fsproj

      - name: Build HTML/CSS package
        run: npm run build

      - name: Enforce zero-runtime boundary
        run: npm run test:runtime

      - name: Test token compiler
        run: npm run test:tokens

      - name: Build Forma showcase
        run: npm run site:build:only

      - name: Validate Forma showcase
        run: npm run site:test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser and accessibility tests
        run: npm run test:browser

      - name: Verify Echelon governance installations
        run: |
          npx --yes @echelon-foundry/sde@1.3.0 verify --strict
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros registry check
          npx --yes @echelon-foundry/visual-engineering@1.0.0 init
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          npm exec --yes --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122 communication-engineering -- verify --strict
