name: Deploy Forma documentation

on:
  push:
    branches: [main]
    paths:
      - "patterns/**"
      - "src/styles/**"
      - "src/marketing/**"
      - "themes/**"
      - "tokens/**"
      - "site/**"
      - "tools/build-site.mjs"
      - "tools/build-assets.mjs"
      - "tests/site-build.test.mjs"
      - "package.json"
      - ".github/workflows/deploy-forma-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forma-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for commit batch
        if: github.event_name == 'push'
        run: sleep 600

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts=false

      - name: Restore token compiler
        run: dotnet restore tools/TokenCompiler/TokenCompiler.fsproj

      - name: Install mobile validation browser
        run: npx playwright install --with-deps chromium

      - name: Build and verify Forma documentation
        run: npm run site:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
