name: Release Forma package

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/release-forma.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: forma-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: npm install --ignore-scripts=false

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Resolve release identity
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v$package_version"
          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error title=Forma version already released::$release_tag points to $tag_commit, not $GITHUB_SHA. Bump package.json before releasing new package contents."
              exit 1
            fi
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Repair legacy v0.1.0 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" != "v0.2.0" ]]; then
            exit 0
          fi

          legacy_parent="$(mktemp -d)"
          legacy_workspace="$legacy_parent/worktree"
          legacy_release="$GITHUB_WORKSPACE/legacy-release"
          mkdir -p "$legacy_release"
          git worktree add --detach "$legacy_workspace" v0.1.0

          (
            cd "$legacy_workspace"
            npm run build
            npm pack --pack-destination "$legacy_release"
          )

          legacy_archive="$legacy_release/echelon-foundry-design-system-0.1.0.tgz"
          test -f "$legacy_archive"
          gh release upload v0.1.0 "$legacy_archive" --clobber
          git worktree remove --force "$legacy_workspace"
          rm -rf "$legacy_parent"

      - name: Validate package and site
        run: |
          npm run check
          npm run site:check

      - name: Pack release
        shell: bash
        run: |
          mkdir -p release
          npm pack --pack-destination release
          archive="$(ls release/*.tgz)"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify release contents
        shell: bash
        run: |
          contents="$(tar -tzf "$ARCHIVE")"
          required_files=(
            package/dist/all.css
            package/dist/tokens.css
            package/dist/foundations.css
            package/dist/components.css
            package/dist/assessment.css
            package/dist/skins.css
            package/dist/brands/echelon.css
            package/dist/brands/example-harbor.css
            package/dist/brands/index.json
            package/dist/marketing.css
            package/dist/marketing/forma-marketing.css
            package/dist/marketing/forma-marketing-theme-echelon.css
            package/dist/marketing/forma-echelon-marketing.css
            package/dist/marketing/forma-all.css
            package/dist/marketing/forma-marketing.manifest.json
            package/dist/marketing/forma-marketing.sha256
            package/docs/MARKETING-SITES.md
            package/schemas/brand-manifest.schema.json
            package/docs/BRANDING.md
            package/patterns/search.html
            package/patterns/data-grid.html
            package/patterns/work-queue.html
          )

          for required in "${required_files[@]}"; do
            grep -qx "$required" <<<"$contents" || {
              echo "missing $required from release package"
              exit 1
            }
          done

      - name: Exercise packed package as a consumer
        shell: bash
        run: |
          workspace="$(mktemp -d)"
          cp "$ARCHIVE" "$workspace/forma.tgz"
          cd "$workspace"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./forma.tgz
          test -f node_modules/@echelon-foundry/design-system/dist/all.css
          test -f node_modules/@echelon-foundry/design-system/dist/skins.css
          test -f node_modules/@echelon-foundry/design-system/dist/brands/echelon.css
          test -f node_modules/@echelon-foundry/design-system/dist/brands/index.json
          test -f node_modules/@echelon-foundry/design-system/schemas/brand-manifest.schema.json
          test -f node_modules/@echelon-foundry/design-system/patterns/data-grid.html

      - name: Exercise marketing assets as a no-Node consumer
        shell: bash
        run: |
          (cd dist/marketing && sha256sum -c forma-marketing.sha256)
          site="$(mktemp -d)"
          printf 'forma %s\ndestination assets/forma\nasset forma-echelon-marketing.css\n' "${RELEASE_TAG#v}" > "$site/forma.lock"
          (cd "$site" && "$GITHUB_WORKSPACE/actions/install-presentation/install.sh" --source "$GITHUB_WORKSPACE/dist/marketing" --update)
          (cd "$site" && "$GITHUB_WORKSPACE/actions/install-presentation/install.sh" --source "$GITHUB_WORKSPACE/dist/marketing")
          test -s "$site/assets/forma/forma-echelon-marketing.css"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Marketing assets are flat, individually downloadable files so a
          # site can pin them without npm (see docs/MARKETING-SITES.md). The
          # tag check above keeps a released version's contents immutable.
          marketing=(dist/marketing/*.css dist/marketing/forma-marketing.manifest.json dist/marketing/forma-marketing.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "${marketing[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "${marketing[@]}" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Forma ${RELEASE_TAG#v}: zero-runtime Echelon Foundry design system. Marketing sites pin forma-echelon-marketing.css through forma.lock; see docs/MARKETING-SITES.md."
          fi

      - name: Publish to npm when trusted publishing is enabled
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: |
          npm install -g npm@11
          npm publish --access public "$ARCHIVE"
