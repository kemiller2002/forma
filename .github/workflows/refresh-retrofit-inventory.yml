name: Refresh retrofit component inventory

on:
  push:
    branches: [feature/machine-operability-retrofit]
    paths:
      - ".github/workflows/refresh-retrofit-inventory.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Regenerate component inventory
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base origin/main HEAD)"
          npm install
          npm run build
          npm run catalog:inventory

          ./ros add "Refresh Forma inventory after machine-operability retrofit" --id "FORMA-GH-100-INVENTORY" --tag forma,catalog,machine-operability --priority medium --source github-issue --source-reference "https://github.com/kemiller2002/forma/issues/100" --actor "agent:openai-chatgpt"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work backlog-transition --action ready --id "FORMA-GH-100-INVENTORY" --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "FORMA-GH-100-INVENTORY" --occurred-at "$NOW" --type mechanical
          git rm .github/workflows/refresh-retrofit-inventory.yml
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id "FORMA-GH-100-INVENTORY" --occurred-at "$NOW" --evidence documentation=docs/COMPONENT-INVENTORY.md --evidence tests=tools/catalog/inventory.mjs
          ./ros registry build
          ROS_BASE_REF="$BASE_SHA" ./ros validate

      - name: Commit refreshed inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          git commit -m "FORMA-GH-100 refresh component inventory"
          git pull --rebase origin feature/machine-operability-retrofit
          git push origin HEAD:feature/machine-operability-retrofit
