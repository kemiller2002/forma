name: Reconcile Forma 0.6 icon site work
on:
  push:
    branches: [feature/forma-0-6-new-icon-pages]
    paths: [.github/workflows/reconcile-icon-pages.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'kemiller2002/forma'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Verify icon contract and reconcile real Git evidence to #122
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          chmod +x ./praxis
          node tools/icons/build.mjs
          node --test tests/icons.test.mjs
          ./praxis registry check
          if ! ./praxis work show GH-122 >/dev/null 2>&1; then
            ./praxis add "Publish navigable pages for 40 new Forma 0.6.0 icons" --id GH-122 --source github-issue --source-reference "https://github.com/kemiller2002/forma/issues/122" --priority high
          fi
          base="$(git merge-base HEAD origin/main)"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          reason="GitHub connector authored generated icon-site projections before executable Praxis session; attribute only genuine committed changes after the fact"
          ./praxis work reconcile --id GH-122 --reason "$reason" --range "$base..HEAD" --occurred-at "$now" --dry-run
          ./praxis work reconcile --id GH-122 --reason "$reason" --range "$base..HEAD" --occurred-at "$now"
          ./praxis registry build
          ./praxis validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/work .ros/events .ros/telemetry registries
          if ! git diff --cached --quiet; then
            git commit -m "praxis: reconcile Forma 0.6.0 icon page update GH-122"
            git push origin HEAD:feature/forma-0-6-new-icon-pages
          fi
