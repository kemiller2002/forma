name: Reconcile Forma release-trigger correction
on:
  push:
    branches: [fix/forma-release-icon-site-triggers]
    paths: [.github/workflows/reconcile-release-triggers.yml, tests/package-contract.test.mjs, .github/workflows/release-forma.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'kemiller2002/forma'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Build and test release safety, reconcile actual Git evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          chmod +x ./praxis
          npm install --ignore-scripts=false
          npm run build
          node --test tests/package-contract.test.mjs
          ./praxis registry check
          if ! ./praxis work show GH-122 >/dev/null 2>&1; then
            ./praxis add "Release Forma when icon and documentation sources change" --id GH-122 --source github-issue --source-reference "https://github.com/kemiller2002/forma/issues/122" --priority high
          fi
          base="$(git merge-base HEAD origin/main)"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          reason="GitHub connector authored immutable Forma release-trigger changes outside an executable Praxis session; reconcile against unmodified Git history"
          ./praxis work reconcile --id GH-122 --reason "$reason" --range "$base..HEAD" --occurred-at "$now" --dry-run
          ./praxis work reconcile --id GH-122 --reason "$reason" --range "$base..HEAD" --occurred-at "$now"
          ./praxis registry build
          ./praxis validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/work .ros/events .ros/telemetry registries
          if ! git diff --cached --quiet; then
            git commit -m "praxis: reconcile Forma release trigger fix GH-122"
            git push origin HEAD:fix/forma-release-icon-site-triggers
          fi
