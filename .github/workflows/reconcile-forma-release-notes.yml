name: Reconcile Forma 0.6 release notes
on:
  push:
    branches: [review/forma-icons-0-6-release-ready]
    paths: [.github/workflows/reconcile-forma-release-notes.yml, icons/registry.json]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'kemiller2002/forma'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Verify release notes and reconcile actual Git changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          chmod +x ./praxis
          ./praxis registry check
          base="$(git merge-base HEAD origin/main)"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          reason="Post-hoc GitHub editor attribution for 0.6.0 release-note and consumer-migration changes under GH-116"
          ./praxis work reconcile --id GH-116 --reason "$reason" --range "$base..HEAD" --occurred-at "$now" --dry-run
          ./praxis work reconcile --id GH-116 --reason "$reason" --range "$base..HEAD" --occurred-at "$now"
          ./praxis registry build
          ./praxis validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/work .ros/events .ros/telemetry registries
          if ! git diff --cached --quiet; then
            git commit -m "praxis: attribute release notes to Forma GH-116"
            git push origin HEAD:review/forma-icons-0-6-release-ready
          fi
