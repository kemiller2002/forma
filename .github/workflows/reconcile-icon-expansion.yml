# One-time, auditable recovery for authored icon changes committed through GitHub.
# This never edits .ros data directly; Praxis establishes all attribution from Git history.
name: Reconcile Forma 80-icon attribution
on:
  push:
    branches: [feature/forma-icons-80-communications]
    paths: [.github/workflows/reconcile-icon-expansion.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'kemiller2002/forma'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate assets and attribute actual Git commits to #116
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          chmod +x ./praxis
          ./praxis registry check
          if ! ./praxis work show GH-116 >/dev/null 2>&1; then
            ./praxis add "Expand Forma icon library from 40 to 80, prioritizing email and communications" --id GH-116 --source github-issue --source-reference "https://github.com/kemiller2002/forma/issues/116" --priority high
          fi
          base="$(git merge-base HEAD origin/main)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          reason="GitHub connector implementation committed before Praxis execution could begin; post-hoc attribution based on unchanged Git history"
          ./praxis work reconcile --id GH-116 --reason "$reason" --range "$base..HEAD" --occurred-at "$timestamp" --dry-run
          ./praxis work reconcile --id GH-116 --reason "$reason" --range "$base..HEAD" --occurred-at "$timestamp"
          node tools/icons/build.mjs
          node --test tests/icons.test.mjs
          ./praxis registry build
          ./praxis validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/work .ros/events .ros/telemetry registries
          if ! git diff --cached --quiet; then
            git commit -m "praxis: reconcile Forma icon expansion #116 using Git history"
            git push origin "HEAD:feature/forma-icons-80-communications"
          fi
