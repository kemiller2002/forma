name: Design system validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "work/**"

permissions:
  contents: read

concurrency:
  group: design-system-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-design-system:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for commit batch
        run: sleep 600
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test tooling
        run: npm install --ignore-scripts=false

      - name: Restore build-time compilers
        run: |
          dotnet restore tools/TokenCompiler/TokenCompiler.fsproj
          dotnet restore tools/BrandCompiler/BrandCompiler.fsproj

      - name: Build HTML/CSS package
        run: npm run build

      - name: Enforce zero-runtime boundary
        run: npm run test:runtime

      - name: Enforce motion model conformance
        run: npm run test:motion

      - name: Test build-time compilers and package contract
        run: |
          npm run test:tokens
          npm run test:brands
          npm run test:package

      - name: Validate Figma contract
        run: npm run test:figma

      - name: Show artifact metrics
        run: cat dist/build-metrics.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser and accessibility tests
        run: npm run test:browser

      - name: Verify Echelon governance installations
        run: |
          npx --yes @echelon-foundry/sde@1.3.0 verify --strict
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros registry check
          npx --yes @echelon-foundry/visual-engineering@1.0.0 init
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify --strict
          npm exec --yes --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122 communication-engineering -- verify --strict
