name: Validate and reconcile US English docs
on:
  push:
    branches: [fix/forma-us-english-docs]
    paths: [.github/workflows/reconcile-us-english.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'kemiller2002/forma'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.x'}
      - name: Verify generated copy and attribute committed changes to GH-138
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          chmod +x ./praxis
          npm install --ignore-scripts=false
          npm run build
          npm run site:build
          node --test tests/icon-docs.test.mjs tests/site-build.test.mjs tests/package-contract.test.mjs
          ./praxis registry check
          if ! ./praxis work show GH-138 >/dev/null 2>&1; then
            ./praxis add "Use American English throughout Forma's public copy" --id GH-138 --source github-issue --source-reference "https://github.com/kemiller2002/forma/issues/138" --priority high
          fi
          base="$(git merge-base HEAD origin/main)"
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          reason="GitHub connector authored US-English wording and test corrections; post-hoc attribute actual committed changes without fabricated evidence"
          ./praxis work reconcile --id GH-138 --reason "$reason" --range "$base..HEAD" --occurred-at "$now" --dry-run
          ./praxis work reconcile --id GH-138 --reason "$reason" --range "$base..HEAD" --occurred-at "$now"
          ./praxis registry build
          ./praxis validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ros/work .ros/events .ros/telemetry registries
          if ! git diff --cached --quiet; then
            git commit -m "praxis: attribute US-English documentation patch GH-138"
            git push origin HEAD:fix/forma-us-english-docs
          fi
