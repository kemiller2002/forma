name: Complete machine-operability retrofit

on:
  push:
    branches: [feature/machine-operability-retrofit]
    paths:
      - ".github/workflows/complete-machine-operability-retrofit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrofit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build and regenerate audit
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          npm run test:machine:audit
          npm run machine:audit
          npx playwright install --with-deps chromium firefox webkit
          npm run test:machine

      - name: Record retrofit evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base origin/main HEAD)"
          ./ros add "Retrofit canonical Tabs and high-risk machine-operability evidence" --id "FORMA-MO-TABS" --tag forma,machine-operability,tabs,parity --priority high --source github-issue --source-reference "https://github.com/kemiller2002/forma/issues/100" --actor "agent:openai-chatgpt"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work backlog-transition --action ready --id "FORMA-MO-TABS" --occurred-at "$NOW"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ./ros work start --id "FORMA-MO-TABS" --occurred-at "$NOW" --type task
          git rm .github/workflows/complete-machine-operability-retrofit.yml
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          ROS_BASE_REF="$BASE_SHA" ./ros work complete --id "FORMA-MO-TABS" --occurred-at "$NOW" --evidence implementation=patterns/tabs.html --evidence tests=tests/browser/machine-operability.spec.mjs --evidence implementation=catalog/machine-operability-evidence.json --evidence documentation=docs/MACHINE-OPERABILITY-AUDIT.md
          ./ros registry build
          ROS_BASE_REF="$BASE_SHA" ./ros validate

      - name: Commit completed retrofit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -d .ros/telemetry ]; then git add -f .ros/telemetry; fi
          git commit -m "FORMA-MO-TABS complete machine-operability retrofit"
          git pull --rebase origin feature/machine-operability-retrofit
          git push origin HEAD:feature/machine-operability-retrofit
