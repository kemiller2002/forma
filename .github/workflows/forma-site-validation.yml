name: Forma site validation

on:
  pull_request:
    branches: [main]
    paths:
      - "patterns/**"
      - "src/styles/**"
      - "tokens/**"
      - "site/**"
      - "tools/build-site.mjs"
      - "tests/site-build.test.mjs"
      - "tests/site-browser/**"
      - "playwright.site.config.mjs"
      - "package.json"
      - "docs/AGENT-USAGE.md"
      - "AGENTS.md"
      - ".github/workflows/forma-site-validation.yml"
  push:
    branches:
      - "work/**"
    paths:
      - "patterns/**"
      - "src/styles/**"
      - "tokens/**"
      - "site/**"
      - "tools/build-site.mjs"
      - "tests/site-build.test.mjs"
      - "tests/site-browser/**"
      - "playwright.site.config.mjs"
      - "package.json"
      - "docs/AGENT-USAGE.md"
      - "AGENTS.md"
      - ".github/workflows/forma-site-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forma-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for commit batch
        if: github.event_name != 'workflow_dispatch'
        run: sleep 600
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts=false
      - run: dotnet restore tools/TokenCompiler/TokenCompiler.fsproj
      - run: npx playwright install --with-deps chromium
      - run: npm run site:check
