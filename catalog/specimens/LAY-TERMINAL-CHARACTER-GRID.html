<main class="forma-stack" data-layout-id="LAY-TERMINAL-CHARACTER-GRID">
<div class="forma-character-grid" data-forma-profile="ibm-3270" data-forma-rows="24" data-forma-status-rows="1" data-forma-columns="80" data-forma-narrow="contained" data-forma-reveal="sequential" data-forma-reveal-rows="1">
  <div class="forma-character-grid__viewport" role="region" aria-labelledby="lay-tcg-cinq-title" tabindex="0">
    <form class="forma-character-grid__surface">
      <span class="forma-character-grid__text" data-forma-row="1" data-forma-col="2" data-forma-len="4">CINQ</span>
      <h1 class="forma-character-grid__text" id="lay-tcg-cinq-title" data-forma-reveal-run data-forma-emphasis="intensified" data-forma-row="1" data-forma-col="33" data-forma-len="16">CUSTOMER INQUIRY</h1>
      <span class="forma-character-grid__text" data-forma-row="1" data-forma-col="64" data-forma-len="5">Date:</span>
      <span class="forma-character-grid__value" data-forma-row="1" data-forma-col="70" data-forma-len="10">2026-09-27</span>
      <span class="forma-character-grid__text" data-forma-row="2" data-forma-col="2" data-forma-len="7">System:</span>
      <span class="forma-character-grid__value" data-forma-row="2" data-forma-col="10" data-forma-len="8">ECHT01</span>
      <span class="forma-character-grid__text" data-forma-row="2" data-forma-col="60" data-forma-len="9">Operator:</span>
      <span class="forma-character-grid__value" data-forma-row="2" data-forma-col="70" data-forma-len="8">OP0142</span>
      <p class="forma-character-grid__text" data-forma-row="4" data-forma-col="2" data-forma-len="52">Enter one or more search criteria, then press Enter.</p>
      <label class="forma-character-grid__label" for="lay-tcg-cinq-custno" data-forma-row="6" data-forma-col="2" data-forma-len="23">Customer number<span class="forma-character-grid__leader" aria-hidden="true"> . . . .</span></label>
      <input class="forma-character-grid__field" id="lay-tcg-cinq-custno" name="custno" type="text" maxlength="10" autocomplete="off" inputmode="numeric" data-forma-row="6" data-forma-col="26" data-forma-len="10">
      <label class="forma-character-grid__label" for="lay-tcg-cinq-last" data-forma-row="7" data-forma-col="2" data-forma-len="23">Last name<span class="forma-character-grid__leader" aria-hidden="true"> . . . . . . .</span></label>
      <input class="forma-character-grid__field" id="lay-tcg-cinq-last" name="last" type="text" maxlength="20" autocomplete="off" data-forma-row="7" data-forma-col="26" data-forma-len="20">
      <label class="forma-character-grid__label" for="lay-tcg-cinq-first" data-forma-row="8" data-forma-col="2" data-forma-len="23">First name<span class="forma-character-grid__leader" aria-hidden="true">  . . . . . .</span></label>
      <input class="forma-character-grid__field" id="lay-tcg-cinq-first" name="first" type="text" maxlength="15" autocomplete="off" data-forma-row="8" data-forma-col="26" data-forma-len="15">
      <label class="forma-character-grid__label" for="lay-tcg-cinq-dob" data-forma-row="9" data-forma-col="2" data-forma-len="23">Date of birth<span class="forma-character-grid__leader" aria-hidden="true"> . . . . .</span></label>
      <input class="forma-character-grid__field" id="lay-tcg-cinq-dob" name="dob" type="text" maxlength="10" autocomplete="off" aria-describedby="lay-tcg-cinq-dob-hint" data-forma-row="9" data-forma-col="26" data-forma-len="10">
      <span class="forma-character-grid__text" id="lay-tcg-cinq-dob-hint" data-forma-emphasis="muted" data-forma-row="9" data-forma-col="38" data-forma-len="12">(YYYY-MM-DD)</span>
      <label class="forma-character-grid__label" for="lay-tcg-cinq-postal" data-forma-row="10" data-forma-col="2" data-forma-len="23">Postal code<span class="forma-character-grid__leader" aria-hidden="true"> . . . . . .</span></label>
      <input class="forma-character-grid__field" id="lay-tcg-cinq-postal" name="postal" type="text" maxlength="10" autocomplete="off" data-forma-row="10" data-forma-col="26" data-forma-len="10">
      <label class="forma-character-grid__label" for="lay-tcg-cinq-acct" data-forma-row="11" data-forma-col="2" data-forma-len="23">Account number<span class="forma-character-grid__leader" aria-hidden="true">  . . . .</span></label>
      <input class="forma-character-grid__field" id="lay-tcg-cinq-acct" name="acct" type="text" maxlength="14" autocomplete="off" data-forma-row="11" data-forma-col="26" data-forma-len="14">
      <p class="forma-character-grid__text" data-forma-row="13" data-forma-col="2" data-forma-len="75">At least one criterion is required. Last names match from the first letter.</p>
      <p class="forma-character-grid__message" id="lay-tcg-cinq-message" role="status" data-forma-severity="information" data-forma-row="21" data-forma-col="2" data-forma-len="78"><span class="forma-character-grid__severity"><span>INFO</span></span> CINQ000I Type search criteria and press Enter.</p>
      <div class="forma-character-grid__group" role="group" aria-label="Function keys">
        <button class="forma-character-grid__key" type="submit" name="action" value="enter" data-forma-action="enter" data-forma-row="22" data-forma-col="2" data-forma-len="12"><kbd>Enter</kbd>=Search</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="clear" formnovalidate data-forma-action="clear" data-forma-row="22" data-forma-col="16" data-forma-len="11"><kbd>Clear</kbd>=Erase</button>
        <button class="forma-character-grid__key" type="button" data-forma-action="reset" data-forma-row="22" data-forma-col="29" data-forma-len="12"><kbd>Reset</kbd>=Unlock</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf1" formnovalidate data-forma-action="pf1" data-forma-row="22" data-forma-col="43" data-forma-len="8"><kbd>PF1</kbd>=Help</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf3" formnovalidate data-forma-action="pf3" data-forma-row="22" data-forma-col="53" data-forma-len="8"><kbd>PF3</kbd>=Exit</button>
      </div>
      <p class="forma-character-grid__status" role="status" data-forma-row="25" data-forma-col="2" data-forma-len="78"><span class="forma-character-grid__indicator"><span>READY</span></span></p>
    </form>
  </div>
</div>
</main>
