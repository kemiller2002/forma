<main class="forma-measure forma-stack" data-layout-id="LAY-FORM-SECTIONED"><header><h1>Account settings</h1><p>Manage profile and security information.</p></header><form class="forma-stack"><section class="forma-stack" aria-labelledby="profile-title"><h2 id="profile-title">Profile</h2><label>First name <input name="first-name" autocomplete="given-name"></label><label>Email <input type="email" name="email" autocomplete="email"></label></section><section class="forma-stack" aria-labelledby="security-title"><h2 id="security-title">Security</h2><label>Current password <input type="password" name="current-password"></label><label>New password <input type="password" name="new-password"></label></section><div class="forma-cluster"><button type="submit">Save changes</button><button type="button">Cancel</button></div></form></main>
