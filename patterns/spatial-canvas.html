<section class="forma-spatial-canvas" aria-labelledby="canvas-title">
  <header class="forma-spatial-canvas__header">
    <div><h2 id="canvas-title">System map</h2><p class="forma-spatial-canvas__orientation">Viewport: services / billing</p></div>
    <div class="forma-cluster" aria-label="Canvas controls"><button type="button">Zoom out</button><button type="button">Reset view</button><button type="button">Zoom in</button></div>
  </header>
  <div class="forma-spatial-canvas__viewport" tabindex="0" aria-label="Scrollable system map">
    <div class="forma-spatial-canvas__surface">
      <article class="forma-surface" id="billing"><h3>Billing</h3><p>Selected node</p></article>
      <article class="forma-surface" id="chrona"><h3>Chrona</h3><p>Time source</p></article>
    </div>
  </div>
  <details class="forma-spatial-canvas__index"><summary>Objects in this view</summary><nav aria-label="Canvas objects"><a href="#billing">Billing</a><a href="#chrona">Chrona</a></nav></details>
</section>
