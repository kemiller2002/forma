<label class="forma-switch" data-forma-motion-weight="standard">
  <input
    class="forma-switch__input"
    type="checkbox"
    role="switch"
    name="notifications"
    value="enabled"
    aria-describedby="notifications-description">
  <span class="forma-switch__track" aria-hidden="true"></span>
  <span class="forma-switch__text">
    <span class="forma-switch__label">Notifications</span>
    <span class="forma-switch__description" id="notifications-description">Receive operational updates.</span>
  </span>
</label>
