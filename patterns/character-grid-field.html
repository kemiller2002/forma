<div class="ef-character-grid" data-ef-rows="10" data-ef-columns="60" data-ef-narrow="contained">
  <div class="ef-character-grid__viewport" role="region" aria-labelledby="character-grid-field-title" tabindex="0">
    <form class="ef-character-grid__surface">
      <h2 class="ef-character-grid__text" id="character-grid-field-title" data-ef-row="1" data-ef-col="23" data-ef-len="14" data-ef-emphasis="intensified">PAYMENT ENTRY</h2>
      <label class="ef-character-grid__label" for="character-grid-field-account" data-ef-row="3" data-ef-col="2" data-ef-len="16">Account<span class="ef-character-grid__leader" aria-hidden="true">  . . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-field-account" name="account" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" required aria-describedby="character-grid-field-account-hint" autocomplete="off" data-ef-row="3" data-ef-col="20" data-ef-len="12">
      <span class="ef-character-grid__text" id="character-grid-field-account-hint" data-ef-row="3" data-ef-col="34" data-ef-len="21" data-ef-emphasis="muted">(required, 12 digits)</span>
      <label class="ef-character-grid__label" for="character-grid-field-reference" data-ef-row="4" data-ef-col="2" data-ef-len="16">Reference<span class="ef-character-grid__leader" aria-hidden="true">  . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-field-reference" name="reference" type="text" maxlength="20" value="INV-1042" autocomplete="off" data-ef-row="4" data-ef-col="20" data-ef-len="20">
      <label class="ef-character-grid__label" for="character-grid-field-amount" data-ef-row="5" data-ef-col="2" data-ef-len="16">Amount<span class="ef-character-grid__leader" aria-hidden="true"> . . . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-field-amount" name="amount" type="text" inputmode="decimal" maxlength="12" value="12,48O.55" aria-invalid="true" aria-describedby="character-grid-field-error" autocomplete="off" data-ef-row="5" data-ef-col="20" data-ef-len="12">
      <label class="ef-character-grid__label" for="character-grid-field-branch" data-ef-row="6" data-ef-col="2" data-ef-len="16">Branch<span class="ef-character-grid__leader" aria-hidden="true"> . . . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-field-branch" name="branch" type="text" maxlength="8" value="NORTH" disabled data-ef-row="6" data-ef-col="20" data-ef-len="8">
      <span class="ef-character-grid__text" data-ef-row="7" data-ef-col="2" data-ef-len="16">Opened<span class="ef-character-grid__leader" aria-hidden="true"> . . . . :</span></span>
      <span class="ef-character-grid__value" data-ef-row="7" data-ef-col="20" data-ef-len="10">2014-03-11</span>
      <label class="ef-character-grid__label" for="character-grid-field-session" data-ef-row="8" data-ef-col="2" data-ef-len="16">Session<span class="ef-character-grid__leader" aria-hidden="true">  . . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-field-session" name="session" type="text" maxlength="16" value="S-20260927-01" readonly data-ef-row="8" data-ef-col="20" data-ef-len="16">
      <p class="ef-character-grid__text" id="character-grid-field-error" data-ef-row="10" data-ef-col="2" data-ef-len="54">Error: Amount must contain digits only, e.g. 12480.55</p>
    </form>
  </div>
</div>
