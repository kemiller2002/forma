<section class="forma-diff-viewer" aria-labelledby="diff-title">
  <header class="forma-diff-viewer__header">
    <h3 id="diff-title">Version comparison</h3>
    <p>2 fields changed</p>
  </header>
  <div class="forma-diff-viewer__grid">
    <section class="forma-diff-viewer__side" aria-label="Previous version">
      <h4>Before</h4>
      <dl>
        <div class="forma-diff-row" data-change="changed"><dt>Status</dt><dd>Draft</dd></div>
        <div class="forma-diff-row"><dt>Owner</dt><dd>Operations</dd></div>
      </dl>
    </section>
    <section class="forma-diff-viewer__side" aria-label="Current version">
      <h4>After</h4>
      <dl>
        <div class="forma-diff-row" data-change="changed"><dt>Status</dt><dd>Ready for review</dd></div>
        <div class="forma-diff-row"><dt>Owner</dt><dd>Operations</dd></div>
      </dl>
    </section>
  </div>
</section>
