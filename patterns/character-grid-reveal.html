<div class="ef-character-grid" data-ef-rows="8" data-ef-columns="60" data-ef-narrow="contained" data-ef-reveal="sequential" data-ef-reveal-rows="3">
  <div class="ef-character-grid__viewport" role="region" aria-labelledby="character-grid-reveal-title" tabindex="0">
    <form class="ef-character-grid__surface">
      <h2 class="ef-character-grid__text" id="character-grid-reveal-title" data-ef-reveal-run data-ef-row="1" data-ef-col="23" data-ef-len="15" data-ef-emphasis="intensified">ECHELON FOUNDRY</h2>
      <p class="ef-character-grid__text" data-ef-reveal-run data-ef-row="2" data-ef-col="21" data-ef-len="18">OPERATIONS NETWORK</p>
      <p class="ef-character-grid__text" data-ef-reveal-run data-ef-row="3" data-ef-col="20" data-ef-len="20" data-ef-emphasis="muted">Authorized use only.</p>
      <label class="ef-character-grid__label" for="character-grid-reveal-operator" data-ef-row="5" data-ef-col="2" data-ef-len="16">Operator<span class="ef-character-grid__leader" aria-hidden="true"> . . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-reveal-operator" name="operator" type="text" maxlength="8" required autocomplete="username" data-ef-row="5" data-ef-col="20" data-ef-len="8">
      <p class="ef-character-grid__message" role="status" data-ef-severity="information" data-ef-row="7" data-ef-col="2" data-ef-len="58"><span class="ef-character-grid__severity"><span>INFO</span></span> Enter your operator ID and press Enter.</p>
      <div class="ef-character-grid__group" role="group" aria-label="Function keys">
        <button class="ef-character-grid__key" type="submit" name="action" value="enter" data-ef-action="enter" data-ef-row="8" data-ef-col="2" data-ef-len="13"><kbd>Enter</kbd>=Sign on</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="pf3" formnovalidate data-ef-action="pf3" data-ef-row="8" data-ef-col="17" data-ef-len="8"><kbd>PF3</kbd>=Exit</button>
      </div>
    </form>
  </div>
</div>
