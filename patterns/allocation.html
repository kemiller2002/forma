<fieldset class="forma-allocation">
  <legend class="forma-allocation__legend">Distribute 10 points across these priorities.</legend>

  <div class="forma-allocation__items">
    <label class="forma-allocation__item">
      <span>Reliability</span>
      <input type="number" name="reliability" min="0" max="10" step="1" value="4" inputmode="numeric">
    </label>
    <label class="forma-allocation__item">
      <span>Delivery speed</span>
      <input type="number" name="delivery-speed" min="0" max="10" step="1" value="3" inputmode="numeric">
    </label>
    <label class="forma-allocation__item">
      <span>Cost efficiency</span>
      <input type="number" name="cost-efficiency" min="0" max="10" step="1" value="3" inputmode="numeric">
    </label>
  </div>

  <div class="forma-allocation__total" data-forma-state="valid" aria-live="polite" aria-atomic="true">
    <span>Total</span>
    <output>10 / 10</output>
  </div>
  <p class="forma-field__description">Limen validates the aggregate total and renders the authoritative state.</p>
</fieldset>
