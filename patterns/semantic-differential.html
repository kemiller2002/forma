<fieldset class="forma-semantic-differential">
  <legend class="forma-semantic-differential__legend">How would you characterize the current process?</legend>

  <div class="forma-semantic-differential__endpoints" aria-hidden="true">
    <span>Highly manual</span>
    <span>Highly automated</span>
  </div>

  <div class="forma-semantic-differential__scale">
    <label><input type="radio" name="automation-level" value="1" required><span aria-hidden="true">1</span><span class="forma-sr-only">Highly manual, position 1 of 7</span></label>
    <label><input type="radio" name="automation-level" value="2"><span aria-hidden="true">2</span><span class="forma-sr-only">Position 2 of 7</span></label>
    <label><input type="radio" name="automation-level" value="3"><span aria-hidden="true">3</span><span class="forma-sr-only">Position 3 of 7</span></label>
    <label><input type="radio" name="automation-level" value="4"><span aria-hidden="true">4</span><span class="forma-sr-only">Position 4 of 7</span></label>
    <label><input type="radio" name="automation-level" value="5"><span aria-hidden="true">5</span><span class="forma-sr-only">Position 5 of 7</span></label>
    <label><input type="radio" name="automation-level" value="6"><span aria-hidden="true">6</span><span class="forma-sr-only">Position 6 of 7</span></label>
    <label><input type="radio" name="automation-level" value="7"><span aria-hidden="true">7</span><span class="forma-sr-only">Highly automated, position 7 of 7</span></label>
  </div>

  <div class="forma-semantic-differential__endpoints forma-semantic-differential__endpoints--mobile">
    <span>1 = Highly manual</span>
    <span>7 = Highly automated</span>
  </div>
</fieldset>
