<fieldset class="forma-range-entry">
  <legend class="forma-range-entry__legend">Acceptable response-time range</legend>
  <p class="forma-field__description">Enter both endpoints. A graphical range slider may be added by Limen as an enhancement, but direct entry remains available.</p>

  <div class="forma-range-entry__inputs">
    <label>
      <span>Minimum</span>
      <input type="number" name="response-time-min" min="0" max="5000" step="50" value="500" inputmode="decimal">
    </label>
    <span class="forma-range-entry__separator" aria-hidden="true">to</span>
    <label>
      <span>Maximum</span>
      <input type="number" name="response-time-max" min="0" max="5000" step="50" value="1500" inputmode="decimal">
    </label>
  </div>

  <p class="forma-range-entry__status" data-forma-state="valid" aria-live="polite">500 to 1500 milliseconds</p>
</fieldset>
