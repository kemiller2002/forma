<fieldset class="ef-choice-group">
  <legend class="ef-choice-group__legend">Which layout is easiest to scan?</legend>

  <label class="ef-choice ef-choice--media">
    <input type="radio" name="layout-choice" value="compact" required>
    <span class="ef-choice__media">
      <img width="160" height="90" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 90'%3E%3Crect width='160' height='90' fill='%23e3e0d7'/%3E%3Crect x='10' y='10' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='21' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='32' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='43' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='54' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='65' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='76' width='140' height='8' fill='%23686d68'/%3E%3C/svg%3E" alt="">
    </span>
    <span class="ef-choice__content">
      <strong>Compact layout</strong>
      <span>Dense rows with minimal whitespace.</span>
    </span>
  </label>

  <label class="ef-choice ef-choice--media">
    <input type="radio" name="layout-choice" value="spacious">
    <span class="ef-choice__media">
      <img width="160" height="90" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 90'%3E%3Crect width='160' height='90' fill='%23e3e0d7'/%3E%3Crect x='10' y='10' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='34' width='140' height='8' fill='%23686d68'/%3E%3Crect x='10' y='58' width='140' height='8' fill='%23686d68'/%3E%3C/svg%3E" alt="">
    </span>
    <span class="ef-choice__content">
      <strong>Spacious layout</strong>
      <span>More separation and larger grouping regions.</span>
    </span>
  </label>
</fieldset>
