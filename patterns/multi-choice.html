<fieldset class="forma-choice-group" aria-describedby="multi-choice-guidance">
  <legend class="forma-choice-group__legend">Select exactly two priorities.</legend>
  <p class="forma-selection-guidance" id="multi-choice-guidance">Choose exactly 2 options. “None of these” cannot be combined with another option.</p>

  <label class="forma-choice">
    <input type="checkbox" name="priorities" value="reliability">
    <span class="forma-choice__content"><strong>Reliability</strong></span>
  </label>
  <label class="forma-choice">
    <input type="checkbox" name="priorities" value="speed">
    <span class="forma-choice__content"><strong>Delivery speed</strong></span>
  </label>
  <label class="forma-choice">
    <input type="checkbox" name="priorities" value="cost">
    <span class="forma-choice__content"><strong>Cost efficiency</strong></span>
  </label>
  <label class="forma-choice forma-choice--exclusive">
    <input type="checkbox" name="priorities" value="none">
    <span class="forma-choice__content"><strong>None of these</strong><span>Exclusive option</span></span>
  </label>

  <p class="forma-selection-status" data-forma-state="incomplete" aria-live="polite">0 of 2 selected</p>
</fieldset>
