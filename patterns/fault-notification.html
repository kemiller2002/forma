<aside
  class="forma-toast forma-fault-notification"
  role="status"
  data-forma-intent="notification"
  data-forma-severity="warning"
  data-forma-motion-weight="standard"
  data-forma-motion-entry
  aria-labelledby="fault-notification-title">
  <div class="forma-fault-notification__marker" aria-hidden="true">!</div>
  <div class="forma-fault-notification__body">
    <p class="forma-fault__severity">Warning</p>
    <h3 class="forma-toast__title" id="fault-notification-title">GitHub is temporarily unavailable</h3>
    <p>Your work is still local. You can retry the synchronization.</p>
    <p class="forma-fault-reference">Reference <code>AG-91B7Q</code></p>
    <div class="forma-recovery-actions" role="group" aria-label="Recovery actions">
      <button type="button" data-forma-aegis-capability="CanRetry">Try again</button>
    </div>
  </div>
  <button type="button" class="forma-fault-notification__dismiss" data-forma-action="dismiss" aria-label="Dismiss notification">Close</button>
</aside>
