<section class="forma-split-pane" data-forma-resizable aria-label="Inspector workspace" style="--forma-split-size: 62%">
  <div class="forma-split-pane__primary" id="resizable-primary">
    <h2>Working surface</h2>
    <p>The application owns the primary size and writes it to <code>--forma-split-size</code>; CSS clamps it to the legal bounds.</p>
  </div>
  <div class="forma-split-pane__separator" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="resizable-primary" aria-label="Resize working surface" aria-valuemin="30" aria-valuemax="80" aria-valuenow="62"></div>
  <aside class="forma-split-pane__secondary" aria-label="Inspector">
    <h3>Inspector</h3>
    <p>Pointer drag and Arrow keys are Limen/application behavior. Both write the same size, so they end in the same state.</p>
  </aside>
</section>
