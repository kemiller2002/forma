<label class="forma-select-field">
  <span class="forma-field__label">Deployment region</span>
  <span class="forma-select" data-forma-motion-weight="standard">
    <select class="forma-select__input" name="region" aria-describedby="region-description">
      <option value="us-east">US East</option>
      <option value="us-west">US West</option>
      <option value="eu-west">Europe West</option>
    </select>
    <span class="forma-select__indicator" aria-hidden="true"></span>
  </span>
  <span class="forma-field__description" id="region-description">Choose where this workload will run.</span>
</label>
