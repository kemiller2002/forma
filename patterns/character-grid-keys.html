<div class="ef-character-grid" data-ef-rows="6" data-ef-columns="80" data-ef-narrow="contained">
  <div class="ef-character-grid__viewport" role="region" aria-labelledby="character-grid-keys-title" tabindex="0">
    <form class="ef-character-grid__surface">
      <h2 class="ef-character-grid__text" id="character-grid-keys-title" data-ef-row="1" data-ef-col="33" data-ef-len="14" data-ef-emphasis="intensified">RECORD LOOKUP</h2>
      <label class="ef-character-grid__label" for="character-grid-keys-record" data-ef-row="2" data-ef-col="2" data-ef-len="16">Record<span class="ef-character-grid__leader" aria-hidden="true"> . . . . :</span></label>
      <input class="ef-character-grid__field" id="character-grid-keys-record" name="record" type="text" maxlength="10" required autocomplete="off" data-ef-row="2" data-ef-col="20" data-ef-len="10">
      <div class="ef-character-grid__group" role="group" aria-label="Function keys">
        <button class="ef-character-grid__key" type="submit" name="action" value="enter" data-ef-action="enter" data-ef-row="5" data-ef-col="2" data-ef-len="12"><kbd>Enter</kbd>=Search</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="clear" formnovalidate data-ef-action="clear" data-ef-row="5" data-ef-col="16" data-ef-len="11"><kbd>Clear</kbd>=Erase</button>
        <button class="ef-character-grid__key" type="button" data-ef-action="reset" data-ef-row="5" data-ef-col="29" data-ef-len="12"><kbd>Reset</kbd>=Unlock</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="pf1" formnovalidate data-ef-action="pf1" data-ef-row="5" data-ef-col="43" data-ef-len="8"><kbd>PF1</kbd>=Help</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="pf3" formnovalidate data-ef-action="pf3" data-ef-row="5" data-ef-col="53" data-ef-len="8"><kbd>PF3</kbd>=Exit</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="pf12" formnovalidate data-ef-action="pf12" data-ef-row="5" data-ef-col="63" data-ef-len="11"><kbd>PF12</kbd>=Cancel</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="pf7" formnovalidate data-ef-action="pf7" disabled data-ef-row="6" data-ef-col="2" data-ef-len="8"><kbd>PF7</kbd>=Back</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="pf8" formnovalidate data-ef-action="pf8" data-ef-row="6" data-ef-col="12" data-ef-len="11"><kbd>PF8</kbd>=Forward</button>
        <button class="ef-character-grid__key" type="submit" name="action" value="export" data-ef-action="export" data-ef-row="6" data-ef-col="25" data-ef-len="15"><kbd>F10</kbd>=Export CSV</button>
      </div>
    </form>
  </div>
</div>
