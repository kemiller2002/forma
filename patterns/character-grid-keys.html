<div class="forma-character-grid" data-forma-rows="6" data-forma-columns="80" data-forma-narrow="contained">
  <div class="forma-character-grid__viewport" role="region" aria-labelledby="character-grid-keys-title" tabindex="0">
    <form class="forma-character-grid__surface">
      <h2 class="forma-character-grid__text" id="character-grid-keys-title" data-forma-row="1" data-forma-col="33" data-forma-len="14" data-forma-emphasis="intensified">RECORD LOOKUP</h2>
      <label class="forma-character-grid__label" for="character-grid-keys-record" data-forma-row="2" data-forma-col="2" data-forma-len="16">Record<span class="forma-character-grid__leader" aria-hidden="true"> . . . . :</span></label>
      <input class="forma-character-grid__field" id="character-grid-keys-record" name="record" type="text" maxlength="10" required autocomplete="off" data-forma-row="2" data-forma-col="20" data-forma-len="10">
      <div class="forma-character-grid__group" role="group" aria-label="Function keys">
        <button class="forma-character-grid__key" type="submit" name="action" value="enter" data-forma-action="enter" data-forma-row="5" data-forma-col="2" data-forma-len="12"><kbd>Enter</kbd>=Search</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="clear" formnovalidate data-forma-action="clear" data-forma-row="5" data-forma-col="16" data-forma-len="11"><kbd>Clear</kbd>=Erase</button>
        <button class="forma-character-grid__key" type="button" data-forma-action="reset" data-forma-row="5" data-forma-col="29" data-forma-len="12"><kbd>Reset</kbd>=Unlock</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf1" formnovalidate data-forma-action="pf1" data-forma-row="5" data-forma-col="43" data-forma-len="8"><kbd>PF1</kbd>=Help</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf3" formnovalidate data-forma-action="pf3" data-forma-row="5" data-forma-col="53" data-forma-len="8"><kbd>PF3</kbd>=Exit</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf12" formnovalidate data-forma-action="pf12" data-forma-row="5" data-forma-col="63" data-forma-len="11"><kbd>PF12</kbd>=Cancel</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf7" formnovalidate data-forma-action="pf7" disabled data-forma-row="6" data-forma-col="2" data-forma-len="8"><kbd>PF7</kbd>=Back</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="pf8" formnovalidate data-forma-action="pf8" data-forma-row="6" data-forma-col="12" data-forma-len="11"><kbd>PF8</kbd>=Forward</button>
        <button class="forma-character-grid__key" type="submit" name="action" value="export" data-forma-action="export" data-forma-row="6" data-forma-col="25" data-forma-len="15"><kbd>F10</kbd>=Export CSV</button>
      </div>
    </form>
  </div>
</div>
