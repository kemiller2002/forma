<button type="button" commandfor="blocking-fault-dialog" command="show-modal">Preview blocking fault</button>
<dialog
  class="forma-dialog forma-fault-blocking"
  id="blocking-fault-dialog"
  data-forma-intent="blocking"
  data-forma-severity="critical"
  data-forma-motion-weight="heavy"
  aria-labelledby="blocking-fault-title"
  aria-describedby="blocking-fault-message">
  <div class="forma-dialog__body">
    <div class="forma-fault-blocking__heading">
      <div class="forma-fault-blocking__marker" aria-hidden="true">!!</div>
      <div>
        <p class="forma-fault__severity">Critical</p>
        <h2 id="blocking-fault-title">This application cannot continue safely</h2>
      </div>
    </div>
    <p id="blocking-fault-message">The current state cannot be verified. Use one of the recovery actions below before continuing.</p>
    <p class="forma-fault-reference">Reference <code>AG-7P2DX</code></p>
  </div>
  <div class="forma-dialog__actions forma-recovery-actions" role="group" aria-label="Recovery actions">
    <button type="button" data-forma-aegis-capability="CanOpenReadOnly">Open read-only</button>
    <button type="button" data-forma-aegis-capability="CanReload">Reload</button>
  </div>
</dialog>
