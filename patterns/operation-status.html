<section class="forma-operation-status" aria-labelledby="operation-title">
  <div class="forma-operation-status__symbol" aria-hidden="true">↻</div>
  <div>
    <span class="forma-status-lozenge" data-state="unknown">Unknown outcome</span>
    <h3 id="operation-title">We cannot confirm whether the save completed</h3>
    <p>Reconcile the operation before retrying. Retrying immediately could create a duplicate effect.</p>
  </div>
  <div class="forma-operation-status__actions">
    <button type="button">Reconcile</button>
    <button type="button">View details</button>
  </div>
</section>
