<article class="forma-conflict-review" aria-labelledby="conflict-title">
  <header class="forma-conflict-review__header">
    <span class="forma-status-lozenge" data-state="attention">Conflict</span>
    <h3 id="conflict-title">This record changed while you were reviewing it</h3>
    <p>No changes were applied. Review the current version before choosing a legal recovery action.</p>
  </header>
  <div class="forma-diff-viewer">
    <div class="forma-diff-viewer__grid">
      <section class="forma-diff-viewer__side"><h4>You reviewed</h4><p>Outstanding balance: $5,000</p></section>
      <section class="forma-diff-viewer__side"><h4>Current</h4><p>Outstanding balance: $2,500</p></section>
    </div>
  </div>
  <footer class="forma-conflict-review__actions">
    <button type="button">Reload current</button>
    <button type="button">Cancel</button>
  </footer>
</article>
