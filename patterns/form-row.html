<div class="ef-form-row">
  <div class="ef-field">
    <label class="ef-field__label" for="form-row-given-name">Given name</label>
    <input id="form-row-given-name" name="given-name" type="text" autocomplete="given-name">
  </div>
  <div class="ef-field">
    <label class="ef-field__label" for="form-row-family-name">Family name</label>
    <span class="ef-field__description" id="form-row-family-name-description">As printed on your passport or national identity card.</span>
    <input id="form-row-family-name" name="family-name" type="text" autocomplete="family-name" aria-describedby="form-row-family-name-description">
  </div>
  <div class="ef-field">
    <label class="ef-field__label" for="form-row-birth-date">Date of birth</label>
    <input id="form-row-birth-date" name="birth-date" type="date" autocomplete="bday">
  </div>
</div>
