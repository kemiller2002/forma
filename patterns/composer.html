<section class="forma-composer" aria-labelledby="composer-title">
  <div class="forma-composer__context">
    <span class="forma-component-kicker">Capture</span>
    <h2 id="composer-title">What do you want this record to know?</h2>
    <p id="composer-help">Type, dictate, paste, or attach information in your own words. The application decides how it is interpreted and whether follow-up is required.</p>
  </div>
  <label class="forma-composer__field">
    <span class="forma-sr-only">Tell the application what happened</span>
    <textarea rows="4" aria-describedby="composer-help" placeholder="Tell me what happened…"></textarea>
  </label>
  <div class="forma-composer__actions">
    <div class="forma-composer__input-actions" aria-label="Additional input methods">
      <button type="button">Attach</button>
      <button type="button">Dictate</button>
    </div>
    <button type="submit" class="forma-composer__submit">Continue</button>
  </div>
  <p class="forma-composer__status" role="status">Nothing is added to the record until the application confirms the transition.</p>
</section>
