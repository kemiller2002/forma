<fieldset class="forma-binary-choice">
  <legend class="forma-binary-choice__legend">Is automated deployment currently in use?</legend>
  <p class="forma-field__description" id="binary-choice-help">Choose one response. An unanswered question remains distinct from No.</p>

  <div class="forma-binary-choice__options" aria-describedby="binary-choice-help">
    <label class="forma-binary-option">
      <input type="radio" name="automated-deployment" value="yes" required>
      <span>Yes</span>
    </label>
    <label class="forma-binary-option">
      <input type="radio" name="automated-deployment" value="no">
      <span>No</span>
    </label>
  </div>
</fieldset>
