<fieldset class="forma-ordinal-scale forma-ordinal-scale--5">
  <legend class="forma-ordinal-scale__legend">Our deployment process is predictable.</legend>

  <div class="forma-ordinal-scale__options">
    <label class="forma-ordinal-option">
      <input type="radio" name="deployment-predictability" value="0" required>
      <span class="forma-ordinal-option__marker" aria-hidden="true">1</span>
      <span class="forma-ordinal-option__label">Strongly disagree</span>
    </label>
    <label class="forma-ordinal-option">
      <input type="radio" name="deployment-predictability" value="1">
      <span class="forma-ordinal-option__marker" aria-hidden="true">2</span>
      <span class="forma-ordinal-option__label">Disagree</span>
    </label>
    <label class="forma-ordinal-option">
      <input type="radio" name="deployment-predictability" value="2">
      <span class="forma-ordinal-option__marker" aria-hidden="true">3</span>
      <span class="forma-ordinal-option__label">Neither agree nor disagree</span>
    </label>
    <label class="forma-ordinal-option">
      <input type="radio" name="deployment-predictability" value="3">
      <span class="forma-ordinal-option__marker" aria-hidden="true">4</span>
      <span class="forma-ordinal-option__label">Agree</span>
    </label>
    <label class="forma-ordinal-option">
      <input type="radio" name="deployment-predictability" value="4">
      <span class="forma-ordinal-option__marker" aria-hidden="true">5</span>
      <span class="forma-ordinal-option__label">Strongly agree</span>
    </label>
  </div>

  <div class="forma-special-choices" aria-label="Other responses">
    <label class="forma-special-choice">
      <input type="radio" name="deployment-predictability" value="unknown">
      <span>Don't know</span>
    </label>
    <label class="forma-special-choice">
      <input type="radio" name="deployment-predictability" value="na">
      <span>Not applicable</span>
    </label>
  </div>
</fieldset>
