<aside
  class="forma-alert forma-fault-banner"
  role="status"
  data-forma-intent="banner"
  data-forma-severity="critical"
  data-forma-motion-weight="standard"
  data-forma-motion-entry
  aria-labelledby="fault-banner-title">
  <div class="forma-alert__icon forma-fault-banner__marker" aria-hidden="true">!!</div>
  <div class="forma-fault-banner__body">
    <p class="forma-fault__severity">Critical</p>
    <h2 class="forma-alert__title" id="fault-banner-title">Diagnostics storage is unavailable</h2>
    <p>The application is running in a degraded state. New diagnostics are queued locally.</p>
    <p class="forma-fault-reference">Reference <code>AG-22K8M</code></p>
  </div>
  <div class="forma-recovery-actions" role="group" aria-label="Recovery actions">
    <button type="button" data-forma-aegis-capability="CanRestoreSink">Reconnect diagnostics</button>
  </div>
</aside>
