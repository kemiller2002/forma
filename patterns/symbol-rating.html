<fieldset class="forma-symbol-rating">
  <legend class="forma-symbol-rating__legend">How satisfied are you with the release process?</legend>

  <div class="forma-symbol-rating__options">
    <label class="forma-symbol-rating__option">
      <input type="radio" name="release-satisfaction" value="1" required>
      <span class="forma-symbol-rating__symbol" aria-hidden="true">★</span>
      <span class="forma-sr-only">1 of 5, very dissatisfied</span>
    </label>
    <label class="forma-symbol-rating__option">
      <input type="radio" name="release-satisfaction" value="2">
      <span class="forma-symbol-rating__symbol" aria-hidden="true">★</span>
      <span class="forma-sr-only">2 of 5, dissatisfied</span>
    </label>
    <label class="forma-symbol-rating__option">
      <input type="radio" name="release-satisfaction" value="3">
      <span class="forma-symbol-rating__symbol" aria-hidden="true">★</span>
      <span class="forma-sr-only">3 of 5, neutral</span>
    </label>
    <label class="forma-symbol-rating__option">
      <input type="radio" name="release-satisfaction" value="4">
      <span class="forma-symbol-rating__symbol" aria-hidden="true">★</span>
      <span class="forma-sr-only">4 of 5, satisfied</span>
    </label>
    <label class="forma-symbol-rating__option">
      <input type="radio" name="release-satisfaction" value="5">
      <span class="forma-symbol-rating__symbol" aria-hidden="true">★</span>
      <span class="forma-sr-only">5 of 5, very satisfied</span>
    </label>
  </div>
</fieldset>
