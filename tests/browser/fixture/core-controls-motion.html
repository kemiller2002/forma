<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forma core control motion fixture</title>
  <link rel="stylesheet" href="/dist/tokens.css">
  <link rel="stylesheet" href="/dist/foundations.css">
  <link rel="stylesheet" href="/dist/components.css">
  <style>
    main { max-inline-size: 48rem; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Core control motion</h1>

    <form id="controls" class="forma-stack">
      <fieldset class="forma-field">
        <legend class="forma-field__label">Density</legend>
        <div class="forma-segmented" data-testid="density">
          <label class="forma-segment"><input type="radio" name="density" value="comfortable" checked><span>Comfortable</span></label>
          <label class="forma-segment"><input type="radio" name="density" value="compact"><span>Compact</span></label>
          <label class="forma-segment"><input type="radio" name="density" value="dense"><span>Dense</span></label>
          <label class="forma-segment"><input type="radio" name="density" value="auto"><span>Automatic spacing</span></label>
        </div>
      </fieldset>

      <fieldset class="forma-field">
        <legend class="forma-field__label">View</legend>
        <div class="forma-segmented" data-testid="view">
          <label class="forma-segment"><input type="radio" name="view" value="list"><span>List</span></label>
          <label class="forma-segment"><input type="radio" name="view" value="board" checked><span>Board</span></label>
          <label class="forma-segment"><input type="radio" name="view" value="timeline"><span>Timeline</span></label>
        </div>
      </fieldset>

      <label class="forma-switch">
        <input class="forma-switch__input" type="checkbox" role="switch" name="alerts" value="on">
        <span class="forma-switch__track" aria-hidden="true"></span>
        <span class="forma-switch__text"><span class="forma-switch__label">Deployment alerts</span></span>
      </label>

      <label class="forma-checkbox">
        <input class="forma-checkbox__input" type="checkbox" name="audit" value="on">
        <span class="forma-checkbox__box" aria-hidden="true"></span>
        <span class="forma-checkbox__text"><span class="forma-checkbox__label">Keep audit trail</span></span>
      </label>

      <div class="forma-slider">
        <div class="forma-slider__header"><label class="forma-slider__label" for="threshold">Threshold</label></div>
        <input class="forma-slider__input" id="threshold" name="threshold" type="range" min="0" max="100" step="1" value="40">
      </div>

      <div class="forma-cluster">
        <button type="button" data-testid="save">Save view</button>
        <button type="button" disabled>Unavailable</button>
      </div>
    </form>
  </main>
</body>
</html>
