<!doctype html>
<html lang="en" data-ef-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIS-001 strict CSP fixture</title>
  <!-- AIS-001 (WI-0045): a hardened Content-Security-Policy (object-src
       'none', as Signal ships) blocks object marks. The identity must stay
       readable: the object's monogram fallback shows, and an inline SVG mark
       is unaffected. -->
  <link rel="stylesheet" href="/dist/all.css">
</head>
<body>
<main class="ef-stack">
  <span class="ef-app-identity" id="csp-object" data-ef-size="64"><span class="ef-app-identity__mark"><object type="image/svg+xml" data="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23234'/%3E%3Cpath d='M8 22 L16 8 L24 22 Z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" aria-hidden="true" tabindex="-1"><span class="ef-app-identity__monogram" aria-hidden="true">N</span></object></span><span class="ef-app-identity__name">Northwind Ledger</span></span>
  <span class="ef-app-identity" id="csp-inline" data-ef-size="64"><span class="ef-app-identity__mark"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M6 0h20a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6Zm10 8-8 14h16Z"/></svg></span><span class="ef-app-identity__name">Northwind Ledger</span></span>
</main>
</body>
</html>
