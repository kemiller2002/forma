<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forma surface physics fixture</title>
  <link rel="stylesheet" href="/dist/tokens.css">
  <link rel="stylesheet" href="/dist/foundations.css">
  <link rel="stylesheet" href="/dist/components.css">
  <style>
    main { max-inline-size: 52rem; margin: 2rem auto; padding: 1rem; display: grid; gap: 1.5rem; }
  </style>
</head>
<body>
<main>
  <details id="physics-disclosure" class="forma-disclosure" data-forma-motion-weight="light">
    <summary>Advanced options</summary>
    <div class="forma-disclosure__content"><p>Additional controls.</p></div>
  </details>

  <div>
    <button id="physics-popover-open" type="button" popovertarget="physics-popover">Show popover</button>
    <div class="forma-popover" id="physics-popover" popover data-forma-motion-weight="light">
      <p>Popover content</p>
      <button id="physics-popover-close" type="button" popovertarget="physics-popover" popovertargetaction="hide">Close popover</button>
    </div>
  </div>

  <div>
    <button id="physics-menu-open" type="button" popovertarget="physics-menu">More actions</button>
    <div class="forma-menu" id="physics-menu" popover data-forma-motion-weight="light">
      <ul class="forma-menu__list">
        <li><button type="button">Duplicate</button></li>
        <li><button type="button">Archive</button></li>
      </ul>
    </div>
  </div>

  <div>
    <button id="physics-dialog-open" type="button" commandfor="physics-dialog" command="show-modal">Open dialog</button>
    <dialog class="forma-dialog" id="physics-dialog" aria-labelledby="physics-dialog-title" data-forma-motion-weight="heavy">
      <div class="forma-dialog__body">
        <h2 id="physics-dialog-title">Confirm action</h2>
        <p>Dialog content.</p>
      </div>
      <div class="forma-dialog__actions">
        <button id="physics-dialog-close" type="button" commandfor="physics-dialog" command="close">Close dialog</button>
      </div>
    </dialog>
  </div>

  <div>
    <button id="physics-flyout-open" type="button" commandfor="physics-flyout" command="show-modal">Open flyout</button>
    <dialog class="forma-flyout" id="physics-flyout" data-forma-side="right" data-forma-motion-weight="heavy" aria-labelledby="physics-flyout-title">
      <div class="forma-flyout__surface">
        <header class="forma-flyout__header">
          <h2 id="physics-flyout-title">Details</h2>
          <button id="physics-flyout-close" type="button" commandfor="physics-flyout" command="close">Close flyout</button>
        </header>
        <div class="forma-flyout__body"><p>Flyout content.</p></div>
      </div>
    </dialog>
  </div>

  <section class="forma-tabs" id="physics-tabs" data-forma-motion-weight="light">
    <div class="forma-tabs__list" role="tablist" aria-label="Physics tabs">
      <button type="button" role="tab" id="physics-tab-a" aria-selected="true" aria-controls="physics-panel-a">Overview</button>
      <button type="button" role="tab" id="physics-tab-b" aria-selected="false" aria-controls="physics-panel-b">History</button>
    </div>
    <section class="forma-tabs__panel" id="physics-panel-a" role="tabpanel" aria-labelledby="physics-tab-a">
      <p>Current panel.</p>
    </section>
  </section>

  <aside id="physics-alert" class="forma-alert" role="status" data-forma-motion-weight="standard" data-forma-motion-entry>
    <div class="forma-alert__icon" aria-hidden="true">!</div>
    <div><h3 class="forma-alert__title">Review required</h3><p>Notification content.</p></div>
    <button type="button">Review</button>
  </aside>

  <div>
    <button id="physics-toast-open" type="button" popovertarget="physics-toast" popovertargetaction="show">Show toast</button>
    <aside class="forma-toast" id="physics-toast" popover="manual" role="status" data-forma-motion-weight="standard">
      <div class="forma-toast__header">
        <div><h3 class="forma-toast__title">Saved</h3><p>Draft stored.</p></div>
        <button id="physics-toast-close" type="button" popovertarget="physics-toast" popovertargetaction="hide" aria-label="Dismiss toast">Close</button>
      </div>
    </aside>
  </div>

  <dialog class="forma-command-palette" id="physics-command" aria-labelledby="physics-command-title" data-forma-motion-weight="heavy">
    <header class="forma-command-palette__header"><h3 id="physics-command-title">Commands</h3></header>
    <label class="forma-visually-hidden" for="physics-command-search">Find a command</label>
    <input id="physics-command-search" type="search">
  </dialog>
</main>
</body>
</html>
